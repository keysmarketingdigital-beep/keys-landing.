# KEYS · Configuración de Netlify
# Al desplegar, Netlify ejecuta el script que crea config.js con tus variables
# de entorno (Site configuration → Environment variables).

[build]
  command = "node scripts/build-config.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'"

# Imágenes: caché de 1 año. Si una imagen cambia, se guarda con OTRO nombre
# (si se reemplaza con el mismo nombre, los visitantes seguirían viendo la vieja).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las demos son páginas completas con su propio código: se les permite lo suyo.
[[headers]]
  for = "/demos/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'"
