# KEYS · Configuración de Netlify
# Al desplegar, Netlify ejecuta el script que crea config.js con tus variables
# de entorno (Site configuration → Environment variables).

[build]
  command = "node scripts/build-config.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.googleadservices.com; frame-src 'self' https://td.doubleclick.net https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Imágenes: caché de 1 año. Si una imagen cambia, se guarda con OTRO nombre
# (si se reemplaza con el mismo nombre, los visitantes seguirían viendo la vieja).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fuentes alojadas en el sitio (antes Google Fonts): no cambian, caché de 1 año.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JavaScript del sitio (antes iba dentro del HTML): caché corta para que los
# cambios lleguen rápido.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Las demos son páginas completas con su propio código: se les permite lo suyo.
[[headers]]
  for = "/demos/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'"

# El subdominio .netlify.app no debe seguir sirviendo el sitio: redirige al
# dominio propio (evita contenido duplicado y que los correos/enlaces viejos
# muestren una URL distinta a la de la marca).
[[redirects]]
  from = "https://keys-digital.netlify.app/*"
  to = "https://keysmarketingdigital.com/:splat"
  status = 301
  force = true
