          '<div class="field"><label>Celular</label><input id="acCel" value="'+c.celular+'" inputmode="numeric"></div>'+
          '<button class="btn btn-ink btn-block" onclick="cGuardarDatos()">Guardar cambios</button>'+
          '<div class="err" id="acErr"></div>'+
          (cflow.msg?'<div class="ok-msg">'+cflow.msg+'</div>':'')+
          (function(){
            const h=historialCliente(cflow.ced);
            if(!h.total) return '';
            let o='<div class="catlabel">Tu historial</div>'+
              '<div class="ph-note" style="margin:0 0 10px">'+h.total+' servicio'+(h.total===1?'':'s')+' realizados con nosotros.</div>';
            if(h.servicios.length){
              o+='<div class="catlabel" style="margin-top:4px">Lo que más pides</div><div class="skills">'+
                h.servicios.slice(0,5).map(x=>'<span class="skill on">'+svcFull(x.id)+' · '+x.n+'</span>').join('')+'</div>';
            }
            if(h.profesionales.length){
              o+='<div class="catlabel">Con quién te atiendes</div><div class="skills">'+
                h.profesionales.map(x=>{ const e=pro(x.id); return e? '<span class="skill'+(x.id===h.proPreferida?' on':'')+'">'+
                  nomComp(e)+' · '+x.n+'</span>':''; }).join('')+'</div>';
            }
            return o;
          })()
        : '<div class="empty">Todavía no tenemos tus datos. Te los pediremos al confirmar tu primera cita.</div>')+
      '<button class="btn btn-out btn-block" style="margin-top:20px" onclick="cLogout()">Salir</button>';
    cflow.msg='';
  }

  /* INICIO */
  else if(cflow.paso==='cat'){
    const n=misCitas().length;
    const tieneDatos = registrado(cflow.ced);
    body='<div class="userbar"><div><b>'+(tieneDatos
          ? cflow.cliente.nombre+' '+cflow.cliente.apellido
          : 'Hola')+'</b>'+
        '<span>CC '+cflow.ced+'</span></div>'+
        '<button class="btn btn-out" style="padding:7px 12px; font-size:12px" onclick="cGo(\'cuenta\')">'+
        (tieneDatos?'Mis datos':'Salir')+'</button></div>'+
      panelPromos()+
      tarjetaCuenta(proximaCita(cflow.ced))+
      bannerRecordatorio()+
      '<h3 class="section">'+(tieneDatos? 'Hola '+cflow.cliente.nombre : '¿Qué deseas hacer?')+'</h3>'+
      (cflow.msg?'<div class="ok-msg" style="margin:0 0 12px">'+cflow.msg+'</div>':'')+
      '<button class="btn btn-ink btn-block" onclick="cGo(\'cats\')">Agendar una cita</button>'+
      '<button class="btn btn-out btn-block" style="margin-top:10px" onclick="cGo(\'mis\')">'+
        'Ver mis citas'+(n?' ('+n+')':'')+'</button>'+
      '<div class="ph-note" style="margin-top:16px">'+store.salon.horario+' · '+store.salon.direccion+'</div>';
    cflow.msg='';
  }

  /* CATEGORÍAS */
  else if(cflow.paso==='cats'){
    body=back('Volver al inicio',"cGo('cat')")+
      '<h3 class="section">¿Qué necesitas hoy?</h3>'+
      store.categorias.filter(c=>store.servicios.some(x=>x.activo && x.cat===c.id)).map(c=>
        '<div class="opt" onclick="cCat(\''+c.id+'\')"><div><b>'+c.nombre+'</b>'+
        '<div class="m">'+(function(){const n=store.servicios.filter(x=>x.activo&&x.cat===c.id).length; return n+' opci'+(n===1?'ón':'ones');})()+'</div></div>'+
        '<span class="arw">&#8250;</span></div>').join('')+
      '<div class="opt multi" onclick="cMulti()"><div><b>Varios servicios</b>'+
        '<div class="m">Combina servicios de distintas áreas en una sola cita</div></div>'+
        '<span class="arw">&#8250;</span></div>';
  }

  else if(cflow.paso==='svc'){
    const c=cat(cflow.cat);
    const lista=store.servicios.filter(s=>s.activo && s.cat===cflow.cat);
    body=back('Volver a las categorías',"cGo('cats')")+
      '<h3 class="section">'+c.nombre+'</h3>'+
      '<div class="ph-note" style="margin:0 0 12px">Puedes marcar más de uno si necesitas varios.</div>'+
      listaServicios(lista)+
      canasta()+
      '<button class="btn btn-ink btn-block"'+(cflow.ids.length?'':' disabled')+' onclick="cGo(\'pro\')">Continuar</button>'+
      '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="cGo(\'cats\')">Volver</button>';
  }

  else if(cflow.paso==='multi'){
    const mod=!!cflow.modId;
    body=(mod? back('Cancelar cambios',"cSalirMod()") : back('Volver a las categorías',"cGo('cats')"))+
      '<h3 class="section">'+(mod?'Modificar tu cita':'Arma tu combinación')+'</h3>'+
      '<div class="ph-note" style="margin:0 0 4px">'+(mod
        ? 'Cambia los servicios si lo necesitas, o continúa para cambiar solo la fecha y la hora.'
        : 'Marca todo lo que necesites. Reservaremos el tiempo de todo junto.')+'</div>'+
      store.categorias.map(c=>{
        const l=store.servicios.filter(s=>s.activo && s.cat===c.id);
        if(!l.length) return '';
        const key='mc_'+c.id;
        const marcados=l.filter(x=>cflow.ids.indexOf(x.id)>=0).length;
        const abierta=!!cflow.grupos[key] || marcados>0;
        return '<div class="opt grp '+(marcados?'sel':'')+'" onclick="cTogGrupo(\''+key+'\')">'+
            '<div><b>'+c.nombre+'</b><div class="m">'+l.length+' opciones'+
            (marcados? ' · '+marcados+' seleccionada'+(marcados>1?'s':'') : '')+'</div></div>'+
            '<span class="arw">'+(abierta?'&#8964;':'&#8250;')+'</span></div>'+
          (abierta? '<div class="zonas">'+listaServicios(l)+'</div>' : '');
      }).join('')+
      canasta()+
      '<button class="btn btn-ink btn-block"'+(cflow.ids.length?'':' disabled')+' onclick="cGo(\'pro\')">Continuar</button>'+
      '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="'+
        (mod?'cSalirMod()':'cGo(\'cats\')')+'">'+(mod?'Cancelar cambios':'Volver')+'</button>';
  }

  else if(cflow.paso==='pro'){
    const disp=prosPara(cflow.ids);
    const hist=historialCliente(cflow.ced);
    const pref = hist.proPreferida && disp.some(e=>e.id===hist.proPreferida) ? pro(hist.proPreferida) : null;
    body=back('Cambiar servicios', cflow.multi?"cGo('multi')":"cGo('svc')")+
      '<h3 class="section">¿Con quién te atiendes?</h3>'+canasta();

    if(!disp.length){
      /* Nadie hace TODOS los servicios: se ofrece repartir entre varias */
      body+='<div class="ph-note" style="margin:0 0 12px">Ninguna profesional conectada hace toda esta '+
        'combinación, pero puedes repartir los servicios entre varias.</div>'+
        '<button class="btn btn-ink btn-block" onclick="cIniciarReparto()">Repartir entre varias profesionales</button>'+
        '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="'+
        (cflow.multi?'cGo(\'multi\')':'cGo(\'svc\')')+'">Cambiar servicios</button>';
    } else {
      /* Opción: cualquiera */
      body+='<div class="opt multi '+(cflow.pid==='any'?'sel':'')+'" onclick="cSetPro(\'any\')">'+
        '<div><b>La primera disponible</b><div class="m">Te asignamos a quien tenga el horario más pronto</div></div>'+
        '<span class="arw">&#8250;</span></div>';
      if(pref) body+='<div class="catlabel">Tu preferida</div>'+
        '<div class="opt '+(cflow.pid===pref.id?'sel':'')+'" onclick="cSetPro(\''+pref.id+'\')">'+
          '<div><b>'+nomComp(pref)+'</b><div class="m">Ya te has atendido con ella</div></div>'+
          '<span class="state completada">disponible</span></div>'+
        '<div class="catlabel">Otras disponibles</div>';
      body+=disp.filter(e=>!pref||e.id!==pref.id).map(e=>
        '<div class="opt '+(cflow.pid===e.id?'sel':'')+'" onclick="cSetPro(\''+e.id+'\')">'+
        '<div><b>'+nomComp(e)+'</b><div class="m">'+rolDe(e)+'</div></div>'+
        '<div class="state completada">disponible</div></div>').join('')+
        (disp.length>1
          ? '<button class="btn-link" onclick="cIniciarReparto()">Prefiero repartir entre varias profesionales</button>'
          : '')+
        '<button class="btn btn-ink btn-block" style="margin-top:6px"'+(cflow.pid?'':' disabled')+
        ' onclick="cGo(\'hora\')">Continuar</button>';
    }
  }

  /* REPARTO: cada servicio con su profesional y su hora */
  else if(cflow.paso==='reparto'){
    body=back('Volver',"cGo('pro')")+
      '<h3 class="section">Acomoda tus servicios</h3>'+
      '<div class="ph-note" style="margin:0 0 12px">Asigna cada servicio a una profesional y una hora. '+
      'Puedes ir viendo la agenda de cada una.</div>'+
      '<div class="field"><label>Día</label><input type="date" value="'+cflow.fecha+'" min="'+todayISO+
        '" onchange="cRepFecha(this.value)"></div>'+
      cflow.ids.map(function(id,i){
        const asg=cflow.reparto[id]||{};
        const posibles=store.profesionales.filter(e=>atiende(e) && svc(id).pros.indexOf(e.id)>=0);
        let sub='<div class="repcard"><div class="repnm">'+(i+1)+'. '+svcFull(id)+
          ' <span class="pill">'+svc(id).durEst+' min</span></div>';
        if(!posibles.length){
          sub+='<div class="empty">Ninguna profesional conectada hace este servicio.</div>';
        } else {
          sub+='<div class="repros">'+posibles.map(e=>
            '<button class="skill '+(asg.pid===e.id?'on':'')+'" onclick="cRepPro(\''+id+'\',\''+e.id+'\')">'+
            nomComp(e)+'</button>').join('')+'</div>';
          if(asg.pid){
            const hs=horasDe(asg.pid, cflow.fecha, [id]).filter(h=>h.ok);
            sub+='<div class="chips" style="margin-top:8px">'+
              (hs.length? hs.map(h=>'<button class="chip '+(asg.hora===h.m?'sel':'')+
                '" onclick="cRepHora(\''+id+'\','+h.m+')">'+minToHHMM(h.m)+'</button>').join('')
                : '<div class="empty">Sin horas libres ese día con '+pro(asg.pid).nombre+'.</div>')+'</div>';
          }
        }
        sub+='</div>';
        return sub;
      }).join('')+
      (cRepartoCompleto()
        ? '<button class="btn btn-ink btn-block" style="margin-top:6px" onclick="cConfirmReparto()">Confirmar todo</button>'
        : '<div class="hint" style="margin-top:6px">Asigna profesional y hora a cada servicio para continuar.</div>');
  }

  else if(cflow.paso==='hora'){
    /* "cualquiera": se resuelve a la profesional con más horas libres ese día */
    let pidReal=cflow.pid;
    if(cflow.pid==='any'){
      const cands=prosPara(cflow.ids).map(e=>({e:e,
        libres:horasDe(e.id,cflow.fecha,cflow.ids,cflow.modId).filter(h=>h.ok).length}))
        .sort((a,b)=>b.libres-a.libres);
      pidReal = cands[0]? cands[0].e.id : null;
      cflow.pidResuelto=pidReal;
    } else { cflow.pidResuelto=cflow.pid; }
    const horas=pidReal? horasDe(pidReal, cflow.fecha, cflow.ids, cflow.modId) : [];
    body=back('Cambiar profesional',"cGo('pro')")+
      '<h3 class="section">Elige día y hora</h3>'+
      '<div class="field"><label>Día</label><input type="date" value="'+cflow.fecha+'" min="'+todayISO+
        '" onchange="cSetFecha(this.value)"></div>'+
      '<div class="chips">'+
        (horas.length? horas.map(h=>'<button class="chip '+(cflow.hora===h.m?'sel':'')+'"'+(h.ok?'':' disabled')+
          ' onclick="cSetHora('+h.m+')">'+minToHHMM(h.m)+'</button>').join('')
          : '<div class="empty">Ese bloque no cabe en la jornada.</div>')+
      '</div><div class="ph-note">Reservamos '+durTotal(cflow.ids)+' min para tu cita. Las horas grises ya están tomadas.</div>'+
      '<button class="btn btn-ink btn-block" style="margin-top:14px"'+(cflow.hora===null?' disabled':'')+
        ' onclick="cGo(\'rev\')">Continuar</button>';
  }

  else if(cflow.paso==='rev'){
    const e=pro(cflow.pid==='any'? cflow.pidResuelto : cflow.pid), mod=!!cflow.modId;
    const nuevo = !registrado(cflow.ced);
    body=back('Cambiar hora',"cGo('hora')")+
      '<h3 class="section">'+(mod?'Confirma los cambios':'Confirma tu cita')+'</h3>'+canasta()+
      (nuevo
        ? '<div class="catlabel">Tus datos</div>'+
          '<div class="ph-note" style="margin:0 0 12px">Es tu primera reserva. Los guardamos para que '+
          'la próxima vez solo necesites tu cédula.</div>'+
          '<div class="row2">'+
            '<div class="field"><label>Nombre</label><input id="dNom" placeholder="María"></div>'+
            '<div class="field"><label>Apellido</label><input id="dApe" placeholder="Pérez"></div></div>'+
          '<div class="field"><label>Celular</label>'+
            '<input id="dCel" inputmode="numeric" placeholder="300 000 0000"></div>'+
          '<div class="field"><label>Documento</label>'+
            '<input id="dDoc" inputmode="numeric" value="'+cflow.ced+'"></div>'+
          '<label class="checkline"><input type="checkbox" id="dAutoriza">'+
            '<span>Autorizo el tratamiento de mis datos personales conforme a la Ley 1581 de 2013 '+
            '(Habeas Data) y la política de tratamiento de datos de '+store.salon.nombre+'.</span></label>'+
          '<div class="err" id="dErr"></div>'
        : '')+
      '<div class="opt" style="cursor:default"><div><b>'+nomComp(e)+'</b><div class="m">Profesional</div></div></div>'+
      '<div class="opt" style="cursor:default"><div><b>'+fechaLarga(cflow.fecha)+' · '+minToHHMM(cflow.hora)+
        '</b><div class="m">Fecha y hora</div></div></div>'+
      '<div class="ph-note">Te enviaremos un recordatorio '+HORAS_RECUERDA+' horas antes.</div>'+
      AVISO+
      '<button class="btn btn-ink btn-block" onclick="cConfirm()">'+
        (mod?'Guardar cambios':'Confirmar cita')+'</button>'+
      (mod? '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="cSalirMod()">Descartar cambios</button>':'');
  }

  else if(cflow.paso==='ok'){
    const t=cflow.ticket;
    let resumen;
    if(t.reparto){
      const citasHoy=store.citas.filter(c=>c.clienteCedula===cflow.ced && c.fecha===t.fecha && c.grupo==='multi')
                                .sort((a,b)=>a.horaInicio-b.horaInicio);
      resumen=citasHoy.map(c=>minToHHMM(c.horaInicio)+' · '+svcFull(c.servicios[0])+' · '+pro(c.profesionalId).nombre).join('<br>');
      resumen=fechaLarga(t.fecha)+'<br>'+resumen;
    } else {
      const e=pro(t.profesionalId);
      resumen=nombresSvc(t.servicios)+'<br>'+e.nombre+' · '+fechaLarga(t.fecha)+' · '+minToHHMM(t.horaInicio);
    }
    body='<div class="ticket"><div class="ok">✓</div><h3>Cita confirmada</h3>'+
      '<div class="ph-note" style="margin-top:8px">'+resumen+'</div></div>'+
      '<div class="remind" style="margin-top:14px"><div class="t"><span class="bell">🔔</span> Recordatorio programado</div>'+
        '<div class="d" style="margin-top:7px">Te avisaremos <b>'+HORAS_RECUERDA+' horas antes</b>, el '+
        fechaLarga(t.fecha)+' hacia las '+minToHHMM(Math.max(0,t.horaInicio-HORAS_RECUERDA*60))+'.</div></div>'+
      AVISO+
      '<button class="btn btn-ink btn-block" onclick="cGo(\'cat\')">Ir al inicio y ver el contador</button>'+
      '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="cGo(\'mis\')">Ver mis citas</button>'+
      '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="cReset()">Hacer otra reserva</button>';
  }

  else if(cflow.paso==='mis'){
    const lista=misCitas();
    body=back('Volver',"cGo('cat')")+
      tarjetaCuenta(proximaCita(cflow.ced))+
      bannerRecordatorio()+
      '<h3 class="section">Mis citas</h3>'+
      (cflow.msg?'<div class="ok-msg" style="margin:0 0 12px">'+cflow.msg+'</div>':'')+
      (lista.length? lista.map(c=>{
        const e=pro(c.profesionalId);
        const h=horasFaltantes(c);
        const ok=puedeCancelar(c);
        const pronto = h>0 && h<=HORAS_RECUERDA;
        return '<div class="mycard '+(pronto?'soon':'')+'">'+
          '<div class="top"><div><div class="w">'+fechaLarga(c.fecha)+' · '+minToHHMM(c.horaInicio)+'</div>'+
            '<div class="sv">'+nombresSvc(c.servicios)+'</div>'+
            '<div class="me">Con '+(e?nomComp(e):'—')+' · '+durTotal(c.servicios)+' min'+
            (h>0?' · '+faltanTexto(c).toLowerCase():'')+'</div></div>'+
            '<div class="state '+c.estado+'">'+c.estado.replace('_',' ')+'</div></div>'+
          (c.estado!=='agendada'
            ? '<div class="lock">Esta cita ya está en curso o terminada.</div>'
            : ok
              ? '<div class="acts">'+
                '<button class="btn btn-sage btn-block" onclick="cAgregarServicio(\''+c.id+'\')">+ Agregar otro servicio a esta cita</button>'+
                '<div style="display:flex; gap:8px; margin-top:8px">'+
                '<button class="btn btn-out" style="flex:1" onclick="cModificar(\''+c.id+'\')">Modificar</button>'+
                '<button class="btn btn-warn" style="flex:1" onclick="cPedirCancelar(\''+c.id+'\')">Cancelar</button></div></div>'
              : '<div class="lock">Ya no puedes modificar ni cancelar: faltan menos de '+HORAS_CANCELA+
                ' horas. Comunícate con el consultorio.</div>')+
        '</div>';
      }).join('') : '<div class="empty">No tienes citas próximas.</div>')+
      AVISO+
      '<button class="btn btn-ink btn-block" onclick="cGo(\'cat\')">Reservar otra cita</button>';
    cflow.msg='';
  }

  else if(cflow.paso==='addsvc'){
    const c=store.citas.filter(x=>x.id===cflow.addCitaId)[0];
    const e=c? pro(c.profesionalId):null;
    cflow.addIds=cflow.addIds||[];
    if(!c){ body='<div class="empty">Cita no encontrada.</div>'; }
    else {
      /* Solo servicios que la MISMA profesional sabe hacer y no están ya en la cita */
      const opciones=store.servicios.filter(x=>x.activo && x.pros.indexOf(e.id)>=0 && c.servicios.indexOf(x.id)<0);
      const nuevos=c.servicios.concat(cflow.addIds);
      const cabe = cflow.addIds.length? libre(c.profesionalId,c.fecha,nuevos,c.horaInicio,c.id) : true;
      body=back('Volver a mis citas',"cGo('mis')")+
        '<h3 class="section">Agregar a tu cita</h3>'+
        '<div class="mycard"><div class="w">'+fechaLarga(c.fecha)+' · '+minToHHMM(c.horaInicio)+'</div>'+
          '<div class="sv">'+nombresSvc(c.servicios)+'</div>'+
          '<div class="me">Con '+nomComp(e)+' · '+durTotal(c.servicios)+' min actuales</div></div>'+
        '<div class="ph-note" style="margin:0 0 10px">Solo aparecen servicios que '+e.nombre+
          ' también realiza. Se suma el tiempo a tu cita.</div>'+
        (opciones.length
          ? store.categorias.map(function(cc){
              const l=opciones.filter(x=>x.cat===cc.id); if(!l.length) return '';
              return '<div class="catlabel">'+cc.nombre+'</div>'+
                l.map(x=>'<div class="opt '+(cflow.addIds.indexOf(x.id)>=0?'sel':'')+'" onclick="cAddTog(\''+x.id+'\')">'+
                '<div><b>'+x.nombre+'</b><div class="m">'+x.durEst+' min</div></div><div class="check">&#10003;</div></div>').join('');
            }).join('')
          : '<div class="empty">No hay más servicios que '+e.nombre+' pueda sumar a esta cita.</div>')+
        (cflow.addIds.length
          ? '<div class="basket"><div class="bt">Se agregará</div><div class="bi">'+
            nombresSvcCorto(cflow.addIds)+'</div><div class="bd">Nuevo total: '+durTotal(nuevos)+' min · '+
            money(precioTotal(nuevos))+(cabe?'':' · <b style="color:var(--warn)">no hay tiempo suficiente</b>')+'</div></div>'
          : '')+
        '<button class="btn btn-ink btn-block"'+((cflow.addIds.length&&cabe)?'':' disabled')+
          ' onclick="cAddConfirm()">Agregar a mi cita</button>';
    }
  }

  else if(cflow.paso==='cancelar'){
    const c=store.citas.filter(x=>x.id===cflow.porCancelar)[0];
    const e=pro(c.profesionalId);
    body=back('No, volver',"cGo('mis')")+
      '<h3 class="section">¿Cancelar esta reserva?</h3>'+
      '<div class="mycard"><div class="w">'+fechaLarga(c.fecha)+' · '+minToHHMM(c.horaInicio)+'</div>'+
        '<div class="sv">'+nombresSvc(c.servicios)+'</div>'+
        '<div class="me">Con '+(e?nomComp(e):'—')+'</div></div>'+
      '<div class="ph-note">El horario quedará libre para otro paciente y no podrás recuperarlo.</div>'+
      '<button class="btn btn-warn btn-block" style="margin-top:14px" onclick="cCancelar()">Sí, cancelar reserva</button>'+
      '<button class="btn btn-out btn-block" style="margin-top:8px" onclick="cGo(\'mis\')">No, mantener mi cita</button>';
  }

  v.innerHTML='<div class="phone"><div class="ph-head"><b>'+store.salon.nombre+'</b>'+
    '<span>miapp.com/odontosomer</span></div><div class="ph-body">'+body+'</div>'+
    '<button class="fab" title="Ayuda y contacto" onclick="cAyuda()">'+
      (cflow.ayuda?'&times;':'&#128172;')+'</button>'+
    hojaAyuda()+
    '</div>';
}

function cGo(p){ cflow.paso=p; renderClient(); }
function cCat(id){ cflow.cat=id; cflow.multi=false; cflow.ids=[]; cflow.pid=null; cflow.hora=null; cflow.paso='svc'; renderClient(); }
function cMulti(){ cflow.multi=true; cflow.cat=null; cflow.ids=[]; cflow.pid=null; cflow.hora=null; cflow.paso='multi'; renderClient(); }
function cTog(id){
  const k=cflow.ids.indexOf(id);
  if(k>=0) cflow.ids.splice(k,1); else cflow.ids.push(id);
  cflow.pid=null; cflow.hora=null; renderClient();
}
/* Busca la franja más próxima entre todas las profesionales que hacen los
   servicios elegidos, mirando hasta 30 días hacia adelante. */
function buscarProximoDisponible(ids){
  const cands=prosPara(ids);
  if(!cands.length) return null;
  for(let d=0; d<30; d++){
    const fecha=addDays(todayISO,d);
    let mejor=null;
    cands.forEach(e=>{
      const hs=horasDe(e.id,fecha,ids).filter(h=>h.ok);
      if(hs.length && (!mejor || hs[0].m<mejor.m)) mejor={pid:e.id, m:hs[0].m};
    });
    if(mejor) return { fecha:fecha, pid:mejor.pid, m:mejor.m };
  }
  return null;
}

function cSetPro(id){
  cflow.pid=id; cflow.hora=null;
  if(id==='any'){
    const prox=buscarProximoDisponible(cflow.ids);
    if(prox){
      cflow.fecha=prox.fecha; cflow.hora=prox.m; cflow.pidResuelto=prox.pid;
      cGo('rev'); return;
    }
  }
  renderClient();
}
function cSetFecha(v){ cflow.fecha=v; cflow.hora=null; renderClient(); }
function cSetHora(m){ cflow.hora=m; renderClient(); }
function cPedirCancelar(id){ cflow.porCancelar=id; cflow.paso='cancelar'; renderClient(); }

/* Modificar: reutiliza el flujo de reserva, pero actualiza la cita existente */
function cAgregarServicio(id){
  cflow.addCitaId=id; cflow.paso='addsvc'; renderClient();
}
function cAddTog(sid){
  cflow.addIds = cflow.addIds||[];
  const k=cflow.addIds.indexOf(sid);
  if(k>=0) cflow.addIds.splice(k,1); else cflow.addIds.push(sid);
  renderClient();
}
function cAddConfirm(){
  const c=store.citas.filter(x=>x.id===cflow.addCitaId)[0];
  const add=cflow.addIds||[];
  if(!c || !add.length) return;
  const e=pro(c.profesionalId);
  /* La misma profesional debe poder hacer los servicios nuevos */
  const noHace=add.filter(sid=>svc(sid).pros.indexOf(e.id)<0);
  if(noHace.length){ alert(nomComp(e)+' no realiza: '+noHace.map(svcFull).join(', ')+'. Resérvalo aparte.'); return; }
  /* El bloque crece; hay que verificar que el tiempo extra quepa sin chocar con la siguiente cita */
  const nuevos=c.servicios.concat(add);
  if(!libre(c.profesionalId, c.fecha, nuevos, c.horaInicio, c.id)){
    alert('No hay tiempo suficiente después de tu cita para agregar eso. Intenta con menos servicios o reserva otra cita.');
    return;
  }
  c.servicios=nuevos;
  c.precioLista=precioTotal(nuevos);
  c.precioCobrado=precioConDescuento(nuevos, c.fecha);
  cflow.addCitaId=null; cflow.addIds=[];
  cflow.msg='Servicio agregado a tu cita.';
  cflow.paso='mis'; renderClient();
}

function cModificar(id){
  const c=store.citas.filter(x=>x.id===id)[0];
  if(!puedeCancelar(c)){ cflow.msg='Ya no puedes modificar esta cita.'; cflow.paso='mis'; renderClient(); return; }
  cflow.modId=id;
  cflow.ids=c.servicios.slice();
  cflow.pid=c.profesionalId;
  cflow.fecha=c.fecha;
  cflow.hora=c.horaInicio;
  cflow.multi=true; cflow.cat=null;
  cflow.paso='multi';
  renderClient();
}
function cSalirMod(){
  cflow.modId=null; cflow.ids=[]; cflow.pid=null; cflow.hora=null;
  cflow.paso='mis'; renderClient();
}
function cCancelar(){
  const c=store.citas.filter(x=>x.id===cflow.porCancelar)[0];
  if(!puedeCancelar(c)){ cflow.msg='No fue posible cancelar: ya pasó el límite de '+HORAS_CANCELA+' horas.';
    cflow.paso='mis'; renderClient(); return; }
  c.estado='cancelada';
  cflow.porCancelar=null;
  cflow.msg='Tu reserva fue cancelada. El horario quedó libre.';
  cflow.paso='mis'; renderClient();
}

function cVerCed(){ cflow.verCed=!cflow.verCed; renderClient(); }

function cLookup(){
  const err=document.getElementById('lErr');
  const ced=((document.getElementById('lUser')||{}).value||'').replace(/\D/g,'');
  cflow.user=ced;
  if(ced.length<6){ err.textContent='Escribe un número de cédula válido (mínimo 6 dígitos).';
    err.classList.add('show'); return; }
  entrarConCedula(ced);
}

function entrarConCedula(ced){
  const c=cli(ced);
  cflow.ced=ced;
  /* Si no existe, se abre una sesión provisional: los datos se piden al confirmar */
  cflow.cliente = c || { cedula:ced, nombre:'', apellido:'', celular:'' };
  cflow.user='';
  if(cflow.recordar) lsSet(claveSesion(), ced); else lsDel(claveSesion());
  cflow.paso='cat';
  renderClient();
}

/* --- Continuar con Google (simulación de demo) ---
   No hay backend en este archivo, así que aquí NO se hace una autenticación real:
   se simula el selector de cuentas para mostrar el flujo. Para producción hay que
   integrar Google Identity Services (https://developers.google.com/identity) y
   validar el token en un servidor antes de crear la sesión. */
function cGoogleAbrir(){ cflow.paso='googleChooser'; renderClient(); }

function cGoogleElegir(i){
  const cuentas=[
    { nombre:'María', apellido:'Pérez', correo:'maria.perez@gmail.com' },
    { nombre:'Carlos', apellido:'Gómez', correo:'carlos.gomez@gmail.com' },
  ];
  const g=cuentas[i];
  const existente=cliPorCorreo(g.correo);
  if(existente){
    /* Ya existe una cuenta con ese correo: entra directo, sin pedir nada más */
    entrarConCedula(existente.cedula);
    return;
  }
  cflow.googleSel=g;
  cflow.paso='googleDoc';
  renderClient();
}

function cGoogleFinalizar(){
  const err=document.getElementById('gErr');
  const g=cflow.googleSel;
  const doc=((document.getElementById('gDoc')||{}).value||'').replace(/\D/g,'');
  const cel=((document.getElementById('gCel')||{}).value||'').replace(/\D/g,'');
  const autoriza=((document.getElementById('gAutoriza')||{}).checked)||false;
  const fallo=m=>{ err.textContent=m; err.classList.add('show'); };
  if(doc.length<6) return fallo('Escribe un número de documento válido.');
  if(cel.length<7) return fallo('Escribe un número de celular válido.');
  if(!autoriza) return fallo('Debes autorizar el tratamiento de tus datos para continuar.');
  if(cli(doc)) return fallo('Ese documento ya está registrado. Ingresa con tu cédula en su lugar.');
  const nuevo={ cedula:doc, nombre:g.nombre, apellido:g.apellido, celular:cel, correo:g.correo };
  store.clientes.push(nuevo);
  cflow.googleSel=null;
  entrarConCedula(doc);
}

function cGuardarDatos(){
  const err=document.getElementById('acErr');
  const g=id=>((document.getElementById(id)||{}).value||'').trim();
  const nom=g('acNom'), ape=g('acApe'), cel=g('acCel').replace(/\D/g,'');
  if(nom.length<2||ape.length<2){ err.textContent='Escribe nombre y apellido.'; err.classList.add('show'); return; }
  if(cel.length<7){ err.textContent='Escribe un celular válido.'; err.classList.add('show'); return; }
  const c=cli(cflow.ced);
  c.nombre=nom; c.apellido=ape; c.celular=cel;
  cflow.cliente=c;
  cflow.msg='Datos actualizados.'; renderClient();
}

function cLogout(){
  lsDel(claveSesion());
  cflow={ paso:'id', ced:'', user:'', cliente:null, cat:null, multi:false, ids:[], grupos:{},
    ayuda:false, faqAbierta:null, pid:null, fecha:todayISO, hora:null, ticket:null,
    porCancelar:null, modId:null, reparto:{}, pidResuelto:null,
    verCed:false, recordar:false, autoriza:false, googleSel:null, msg:'' };
  renderClient();
}

function cIniciarReparto(){
  cflow.reparto={};
  const hist=historialCliente(cflow.ced);
  /* prellenar con la preferida donde sea posible */
  cflow.ids.forEach(function(id){
    const pos=store.profesionales.filter(e=>atiende(e) && svc(id).pros.indexOf(e.id)>=0);
    const pref = hist.proPreferida && pos.some(e=>e.id===hist.proPreferida) ? hist.proPreferida
               : (pos[0]?pos[0].id:null);
    cflow.reparto[id]={ pid:pref, hora:null };
    if(pref) cflow.reparto[id].hora=cRepPrimeraLibre(id,pref);
  });
  cflow.paso='reparto'; renderClient();
}
function cRepFecha(f){ cflow.fecha=f;
  Object.keys(cflow.reparto).forEach(id=>{ cflow.reparto[id].hora=null; }); renderClient(); }
function cRepPro(id,pid){ cflow.reparto[id]={ pid:pid, hora:null };
  cflow.reparto[id].hora=cRepPrimeraLibre(id,pid); renderClient(); }

/* Primera hora libre para este servicio que además no se cruce con los otros ya ubicados */
function cRepPrimeraLibre(id,pid){
  const fin=m=>m+bloque([id]);
  const otros=cflow.ids.filter(x=>x!==id).map(x=>cflow.reparto[x]).filter(a=>a&&a.hora!==null)
    .map(a=>({ini:a.hora, fin:a.hora+bloque([cflow.ids.find(function(z){return cflow.reparto[z]===a;})])}));
  const hs=horasDe(pid,cflow.fecha,[id]).filter(h=>h.ok);
  for(const h of hs){
    const choca=otros.some(o=>h.m<o.fin && o.ini<fin(h.m));
    if(!choca) return h.m;
  }
  return hs[0]? hs[0].m : null;
}
function cRepHora(id,m){ cflow.reparto[id].hora=m; renderClient(); }
function cRepartoCompleto(){
  return cflow.ids.length>0 && cflow.ids.every(id=>{
    const a=cflow.reparto[id]; return a && a.pid && a.hora!==null; });
}
function cConfirmReparto(){
  if(!cRepartoCompleto()) return;
  /* Validar que no se solapen dos servicios del mismo paciente en el mismo horario */
  const usados=[];
  for(let i=0;i<cflow.ids.length;i++){
    const id=cflow.ids[i], a=cflow.reparto[id], fin=a.hora+bloque([id]);
    if(!libre(a.pid, cflow.fecha, [id], a.hora)){ cflow.paso='reparto'; renderClient(); return; }
    for(let j=0;j<usados.length;j++){
      if(a.hora < usados[j].fin && usados[j].ini < fin){
        alert('Dos de tus servicios quedaron a la misma hora. Sepáralos.'); return; }
    }
    usados.push({ ini:a.hora, fin:fin });
  }
  /* Crear una cita por servicio */
  cflow.ids.forEach(function(id){
    const a=cflow.reparto[id];
    store.citas.push({ id:uid(), clienteCedula:cflow.ced, servicios:[id], profesionalId:a.pid,
      fecha:cflow.fecha, horaInicio:a.hora, estado:'agendada', inicioReal:null, finReal:null,
      precioLista:precioTotal([id]), precioCobrado:precioConDescuento([id], cflow.fecha), origen:'cliente', grupo:'multi' });
  });
  cflow.ticket={ servicios:cflow.ids.slice(), profesionalId:cflow.reparto[cflow.ids[0]].pid,
    fecha:cflow.fecha, horaInicio:cflow.reparto[cflow.ids[0]].hora, reparto:true };
  cflow.reparto={}; cflow.paso='ok'; renderClient();
}

function cConfirm(){
  /* Primera reserva: se piden nombre, celular y documento antes de agendar */
  if(!registrado(cflow.ced)){
    const err=document.getElementById('dErr');
    const g=id=>((document.getElementById(id)||{}).value||'').trim();
    const nom=g('dNom'), ape=g('dApe');
    const cel=g('dCel').replace(/\D/g,''), doc=g('dDoc').replace(/\D/g,'');
    const autoriza=((document.getElementById('dAutoriza')||{}).checked)||false;
    const fallo=m=>{ if(err){ err.textContent=m; err.classList.add('show'); } };
    if(nom.length<2) return fallo('Escribe tu nombre.');
    if(ape.length<2) return fallo('Escribe tu apellido.');
    if(cel.length<7) return fallo('Escribe un número de celular válido.');
    if(doc.length<6) return fallo('Escribe un número de documento válido.');
    if(!autoriza) return fallo('Debes autorizar el tratamiento de tus datos para continuar.');
    if(doc!==cflow.ced && cli(doc)) return fallo('Ese documento ya está registrado con otros datos.');
    let c=cli(doc);
    if(c){ c.nombre=nom; c.apellido=ape; c.celular=cel; }
    else { c={ cedula:doc, nombre:nom, apellido:ape, celular:cel }; store.clientes.push(c); }
    cflow.ced=doc; cflow.cliente=c;
  }

  const pidFinal = (cflow.pid==='any' ? cflow.pidResuelto : cflow.pid);
  if(!pidFinal || !libre(pidFinal, cflow.fecha, cflow.ids, cflow.hora, cflow.modId)){
    cflow.hora=null; cflow.paso='hora'; renderClient(); return; }
  cflow.pid=pidFinal;

  if(cflow.modId){
    const c=store.citas.filter(x=>x.id===cflow.modId)[0];
    c.servicios=cflow.ids.slice();
    c.profesionalId=cflow.pid;
    c.fecha=cflow.fecha;
    c.horaInicio=cflow.hora;
    c.precioLista=precioTotal(cflow.ids);
    c.precioCobrado=precioConDescuento(cflow.ids, cflow.fecha);
    cflow.modId=null; cflow.ids=[]; cflow.pid=null; cflow.hora=null;
    cflow.msg='Tu cita fue modificada. Te llegará el recordatorio con la nueva hora.';
    cflow.paso='mis'; renderClient(); return;
  }

  const cita={ id:uid(), clienteCedula:cflow.ced, servicios:cflow.ids.slice(), profesionalId:cflow.pid,
    fecha:cflow.fecha, horaInicio:cflow.hora, estado:'agendada', inicioReal:null, finReal:null,
    precioLista:precioTotal(cflow.ids), precioCobrado:precioConDescuento(cflow.ids, cflow.fecha), origen:'cliente' };
  store.citas.push(cita);
  cflow.ticket=cita; cflow.paso='ok'; renderClient();
}
function cReset(){ cflow={ paso:'cats', ced:cflow.ced, cliente:cflow.cliente, cat:null, multi:false, ids:[], grupos:{}, ayuda:false, faqAbierta:null,
  pid:null, fecha:todayISO, hora:null, ticket:null, porCancelar:null, modId:null, reparto:{}, pidResuelto:null, msg:'' }; renderClient(); }
