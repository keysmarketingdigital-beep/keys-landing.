<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultorio Dra. Laura Restrepo — Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22323F; --ink-soft:#647688; --paper:#FBFCFD; --sand:#F1F6FA;
  --greige:#93A3B1; --sage:#6E8AA3; --sage-deep:#1F3A54; --sage-soft:#E8EFF5;
  --champagne:#B79766; --champagne-soft:#F0E9DC; --warn:#B0654C;
  --line:rgba(31,58,84,0.12); --shadow:0 24px 55px rgba(31,58,84,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif; color:var(--ink);
  background:
    radial-gradient(1000px 550px at 15% -10%, rgba(31,58,84,0.06), transparent 55%),
    radial-gradient(900px 500px at 100% 100%, rgba(110,138,163,0.08), transparent 55%),
    var(--sand);
  min-height:100vh; padding:28px 20px 60px;
}
.wrap{ max-width:1040px; margin:0 auto; }

.rolebar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:26px; }
.rolebar .brand{ display:flex; align-items:center; gap:11px; margin-right:auto; }
.rolebar .mark{ width:38px; height:38px; border-radius:50%; border:1.5px solid var(--champagne);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:500; font-size:14px; }
.rolebar .brand b{ font-family:'Fraunces',serif; font-weight:500; font-size:17px; display:block; }
.rolebar .brand span{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); }
.roles{ display:flex; gap:6px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; }
.roles button{ font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft);
  background:transparent; border:none; padding:9px 16px; border-radius:9px; cursor:pointer; }
.roles button.on{ background:var(--ink); color:var(--paper); }

.view{ display:none; animation:fade .25s ease; }
.view.on{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.card{ background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
.card + .card{ margin-top:20px; }
.card-head{ padding:20px 22px 0; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--champagne); }
.card-head h2{ font-family:'Fraunces',serif; font-weight:500; font-size:21px; margin-top:6px; }
.card-head p{ font-size:13px; color:var(--ink-soft); margin-top:5px; line-height:1.5; }
.card-body{ padding:18px 22px 22px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:820px){ .grid2{ grid-template-columns:1fr; } }
.headrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }

.back{ display:inline-flex; align-items:center; gap:7px; background:none; border:none; cursor:pointer;
  font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft); padding:8px 0; margin-bottom:4px; }
.card-head > .back{ display:flex; width:fit-content; }
.back:hover{ color:var(--ink); }
.back .arw{ font-size:15px; line-height:1; }

.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.tile{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 16px; }
.tile .k{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
.tile .v{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin-top:6px; }
.tile .v small{ font-size:13px; color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:500; }

/* Equipo */
.team{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
.pcard.conectada{ border-color:var(--sage-deep); background:linear-gradient(180deg,var(--sage-soft),#fff 60%); }
.pcard .av.live{ background:var(--sage-deep); position:relative; }
.pcard .av .dot{ position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%;
  background:#3ecf6a; border:2px solid var(--paper); }
.repcard{ border:1.5px solid var(--line); border-radius:13px; padding:13px; margin-bottom:10px; background:#fff; }
.repnm{ font-weight:600; font-size:13.5px; margin-bottom:9px; }
.repros{ display:flex; gap:6px; flex-wrap:wrap; }

.pcard{ border:1.5px solid var(--line); border-radius:16px; background:#fff; padding:16px; cursor:pointer; }
.pcard:hover{ border-color:var(--sage-deep); }
.pcard .top{ display:flex; align-items:center; gap:12px; }
.pcard .av{ width:44px; height:44px; border-radius:50%; background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:16px; flex-shrink:0; }
.pcard .av.off{ background:var(--greige); }
.pcard .nm b{ font-size:15px; display:block; }
.pcard .nm span{ font-size:11.5px; color:var(--ink-soft); }
.pcard .meta{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
.tag{ font-size:11px; padding:4px 10px; border-radius:20px; background:var(--sand); color:var(--ink-soft); }
.tag.on{ background:var(--sage-soft); color:var(--sage-deep); font-weight:600; }
.tag.off{ background:var(--champagne-soft); color:var(--warn); }
.tag.pct{ font-family:'IBM Plex Mono',monospace; background:#fff; border:1.5px solid var(--line); color:var(--ink); }
.pcard .foot{ margin-top:12px; padding-top:11px; border-top:1px dashed var(--line);
  font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; }
.pcard.add{ border-style:dashed; border-color:var(--champagne); background:var(--champagne-soft);
  display:flex; align-items:center; justify-content:center; text-align:center; min-height:120px; }
.pcard.add b{ font-size:14.5px; display:block; } .pcard.add span{ font-size:11.5px; color:var(--ink-soft); }

/* Acordeón de servicios */
.acc{ border:1.5px solid var(--line); border-radius:14px; background:#fff; margin-bottom:9px; overflow:hidden; }
.acc.open{ border-color:var(--sage-deep); }
.acchead{ display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer; flex-wrap:wrap; }
.acchead .nm{ flex:1 1 160px; min-width:0; }
.acchead .nm b{ font-size:14.5px; }
.acchead .nm .s{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.acchead .chev{ color:var(--greige); font-size:15px; transition:transform .2s ease; }
.acc.open .acchead .chev{ transform:rotate(90deg); }
.accbody{ padding:0 14px 16px; border-top:1px dashed var(--line); margin-top:-2px; }
.accsec{ margin-top:14px; }
.accsec .t{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }
.miniappt{ display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px;
  background:var(--sand); margin-bottom:6px; font-size:12.5px; }
.miniappt .h{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
.miniappt .g{ flex:1; min-width:0; }
.miniappt .g .w{ font-weight:600; }
.miniappt .g .p{ font-size:11px; color:var(--ink-soft); }

.skills{ display:flex; gap:6px; flex-wrap:wrap; }
.skill{ font-size:11.5px; padding:6px 12px; border-radius:20px; border:1.5px solid var(--line);
  background:#fff; color:var(--ink-soft); cursor:pointer; font-family:'Inter',sans-serif; }
.skill.on{ border-color:var(--sage-deep); background:var(--sage-soft); color:var(--ink); font-weight:600; }
.skill.dim{ opacity:.5; }
.iconbtn{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:17px; padding:4px 8px; border-radius:8px; line-height:1; }
.iconbtn:hover{ color:var(--warn); background:rgba(161,108,87,.08); }

.mini{ display:flex; align-items:center; gap:6px; }
.mini label{ font-size:11px; color:var(--ink-soft); }
.mini input{ width:96px; padding:8px 9px; border:1.5px solid var(--line); border-radius:9px;
  font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:right; background:#fff; }
.mini input:focus{ outline:2px solid var(--sage-deep); outline-offset:1px; }
.mini .unit{ font-size:11px; color:var(--ink-soft); }

.toggle{ position:relative; width:44px; height:24px; border-radius:20px; background:rgba(59,53,44,0.18); cursor:pointer; flex-shrink:0; transition:background .18s ease; }
.toggle::after{ content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .18s ease; }
.toggle.on{ background:var(--sage-deep); }
.toggle.on::after{ transform:translateX(20px); }

.catlabel{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:var(--ink-soft); margin:18px 0 8px; }
.catlabel:first-child{ margin-top:0; }

.addbox{ background:#fff; border:1.5px dashed var(--line); border-radius:14px; padding:16px; margin-top:10px; }
.addbox .r{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.addbox .f{ flex:1 1 150px; }
.addbox label{ display:block; font-size:11px; color:var(--ink-soft); font-weight:600; margin-bottom:5px; }
.addbox input{ width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:9px;
  font-family:'Inter',sans-serif; font-size:13.5px; background:#fff; }

.money{ width:100%; border-collapse:collapse; }
.money th,.money td{ text-align:right; padding:11px 8px; font-size:13.5px; border-bottom:1px solid var(--line); }
.money th{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
.money td:first-child,.money th:first-child{ text-align:left; }
.money .who{ font-weight:600; }
.money tfoot td{ font-weight:700; border-bottom:none; border-top:2px solid var(--ink); }
.money .cut{ color:var(--sage-deep); font-weight:600; }
.tscroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.tscroll .money{ min-width:420px; }

.appt{ display:flex; align-items:center; gap:14px; padding:14px; border:1.5px solid var(--line); border-radius:14px; background:#fff; margin-bottom:10px; }
.appt .time{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; width:52px; flex-shrink:0; }
.appt .info{ flex:1; min-width:0; }
.appt .info b{ font-size:14px; }
.appt .info .c{ font-size:12px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
.appt .info .sv{ color:var(--ink); font-weight:500; }
.appt.done{ opacity:.62; }
.appt.live{ border-color:var(--sage-deep); background:var(--sage-soft); }
.state{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:20px; }
.state.agendada{ background:var(--sand); color:var(--ink-soft); }
.state.en_curso{ background:var(--champagne); color:#fff; }
.state.completada{ background:var(--sage-deep); color:#fff; }
.state.cancelada{ background:rgba(161,108,87,.15); color:var(--warn); }
.pctbox{ background:#fff; border:1.5px solid var(--line); border-radius:13px; padding:13px 15px; margin-bottom:6px; }
.pcthead{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-soft); margin-bottom:9px; }
.pctrow{ display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:7px 0; border-bottom:1px dashed var(--line); font-size:13.5px; font-weight:500; }
.pctrow:last-of-type{ border-bottom:none; }
.pctrow .mini input{ width:74px; }

/* Calendario mensual */
.calnav{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
.calnav b{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; }
.calbtn{ width:34px; height:34px; border-radius:10px; border:1.5px solid var(--line);
  background:#fff; cursor:pointer; font-size:17px; line-height:1; color:var(--ink); }
.calbtn:disabled{ opacity:.3; cursor:not-allowed; }
.calgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cdh{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding-bottom:4px; }
.cd{ position:relative; aspect-ratio:1/1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; border:1.5px solid var(--line); border-radius:10px;
  background:#fff; cursor:pointer; font-size:13.5px; }
.cd.vacio{ border:none; background:none; cursor:default; }
.cd:hover:not(.pasado):not(.vacio){ border-color:var(--sage-deep); }
.cd.pasado{ opacity:.3; cursor:not-allowed; background:var(--sand); }
.cd.hoy .n{ font-weight:700; color:var(--sage-deep); }
.cd.sel{ background:var(--sage); border-color:var(--sage-deep); font-weight:600; }
.cd.conblk{ background:repeating-linear-gradient(45deg,var(--champagne-soft),var(--champagne-soft) 3px,#fff 3px,#fff 6px);
  border-color:var(--champagne); }
.cd .mk{ position:absolute; bottom:5px; width:auto; min-width:5px; height:5px; border-radius:3px; }
.cd .mk.cit{ background:var(--greige); color:transparent; font-size:0; padding:0 3px; }
.cd .mk.blk{ background:var(--champagne); }
.leyenda .sw.cit{ background:var(--greige); border-color:var(--greige); }

/* Franjas del horario fijo */
.franjas{ margin:4px 0 10px; }
.franja{ display:flex; align-items:center; gap:12px; padding:11px 13px; margin-bottom:7px;
  border:1.5px solid var(--sage-deep); border-radius:11px; background:var(--sage-soft); }
.franja .h{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; flex:1; }
.franja .d{ font-size:11.5px; color:var(--ink-soft); }

.slotgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:7px; }
.slot{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:11px 4px; border-radius:10px;
  border:1.5px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
.slot.ocu{ background:var(--sand); color:var(--ink-soft); opacity:.6; cursor:not-allowed; }
.slot.blk{ background:repeating-linear-gradient(45deg,var(--champagne-soft),var(--champagne-soft) 4px,#fff 4px,#fff 8px);
  border-color:var(--champagne); color:var(--ink-soft); cursor:not-allowed; }
.slot.sel{ background:var(--sage); border-color:var(--sage-deep); font-weight:600; }
.rangosel{ margin-top:12px; padding:11px 13px; border-radius:11px; background:var(--sage-soft);
  font-size:12.5px; line-height:1.7; }
.rangosel b{ font-family:'IBM Plex Mono',monospace; }
.mini-nota{ color:var(--ink-soft); font-size:11.5px; }

.leyenda{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--ink-soft); }
.leyenda span{ display:flex; align-items:center; gap:6px; }
.leyenda .sw{ width:13px; height:13px; border-radius:5px; border:1.5px solid var(--line); background:#fff; display:inline-block; }
.leyenda .sw.ocup{ opacity:.35; background:var(--sand); }
.leyenda .sw.blk{ background:repeating-linear-gradient(45deg,var(--champagne-soft),var(--champagne-soft) 3px,#fff 3px,#fff 6px); border-color:var(--champagne); }
.chip.blk{ background:repeating-linear-gradient(45deg,var(--champagne-soft),var(--champagne-soft) 4px,#fff 4px,#fff 8px); border-color:var(--champagne); }
.leyenda .sw.sel{ background:var(--sage); border-color:var(--sage-deep); }

.pesos{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); }
.detbox{ background:var(--sand); border-radius:12px; padding:6px 14px 14px; margin:4px 0 10px; }
.detrow{ display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:8px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.detrow:last-child{ border-bottom:none; }
.money td .detbox{ margin:0; }

.datestrip{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; -webkit-overflow-scrolling:touch; }
.dchip{ flex:0 0 auto; width:62px; padding:9px 0; border:1.5px solid var(--line); border-radius:12px;
  background:#fff; cursor:pointer; text-align:center; font-family:'Inter',sans-serif; }
.dchip .dw{ display:block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); }
.dchip .dn{ display:block; font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:2px 0; }
.dchip .dl{ display:block; font-size:9px; color:var(--sage-deep); }
.dchip.sel{ border-color:var(--sage-deep); background:var(--sage-soft); }
.dchip.llena{ opacity:.4; cursor:not-allowed; }
.dchip.llena .dl{ color:var(--warn); }

.valtag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 10px;
  border-radius:20px; background:var(--sand); color:var(--ink-soft); }
.valtag.done{ background:var(--sage-soft); color:var(--sage-deep); font-weight:600; }
.valbox{ display:inline-flex; align-items:center; gap:7px; }
.valbox label{ font-size:10.5px; font-family:'IBM Plex Mono',monospace; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-soft); }
.valbox input{ width:106px; padding:6px 9px; border:1.5px solid var(--sage-deep); border-radius:9px;
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; background:#fff; }
.valbox input:focus{ outline:2px solid var(--sage-deep); outline-offset:1px; }

.pill{ font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 9px; border-radius:20px; background:var(--sand); color:var(--ink); white-space:nowrap; }

.btn{ font-family:'Inter',sans-serif; font-weight:600; font-size:13px; border:none; border-radius:10px; padding:10px 14px; cursor:pointer; }
.btn-ink{ background:var(--ink); color:var(--paper); }
.btn-sage{ background:var(--sage-deep); color:#fff; }
.btn-out{ background:#fff; border:1.5px solid var(--line); color:var(--ink); }
.btn-warn{ background:#fff; border:1.5px solid var(--warn); color:var(--warn); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-block{ width:100%; padding:14px; font-size:14.5px; border-radius:12px; }

.tabs{ display:flex; gap:6px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; margin-bottom:16px; }
.tabs button{ flex:1; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft);
  background:transparent; border:none; padding:10px; border-radius:9px; cursor:pointer; }
.tabs button.on{ background:var(--sage-soft); color:var(--ink); }

.avail{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:14px; margin-bottom:18px;
  border:1.5px solid var(--line); background:#fff; }
.avail.off{ background:var(--champagne-soft); border-color:var(--champagne); }
.avail .grow{ flex:1; }
.avail b{ font-size:14px; } .avail .s{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

.daygroup{ margin-bottom:16px; }
.daygroup .dhead{ display:flex; align-items:baseline; gap:10px; padding-bottom:8px; border-bottom:1.5px solid var(--line); margin-bottom:10px; }
.daygroup .dhead b{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
.daygroup .dhead span{ font-size:12px; color:var(--ink-soft); }
.daygroup.today .dhead b{ color:var(--sage-deep); }

.field{ margin-bottom:13px; }
.field label{ display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }
.field input,.field select{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:'Inter',sans-serif; font-size:14px; background:#fff; }
.field input:focus,.field select:focus{ outline:2px solid var(--sage-deep); outline-offset:1px; }
.row2{ display:flex; gap:10px; } .row2 .field{ flex:1; }

.phone{ max-width:400px; margin:0 auto; background:var(--paper); border:1px solid var(--line);
  border-radius:22px; box-shadow:var(--shadow); overflow:hidden; }
.phone{ position:relative; }
.fab{ position:absolute; right:16px; bottom:16px; width:52px; height:52px; border-radius:50%;
  border:none; background:var(--ink); color:var(--paper); font-size:21px; cursor:pointer;
  box-shadow:0 8px 20px rgba(59,53,44,.32); z-index:20; line-height:1; }
.fab:active{ transform:scale(.94); }

.sheetbg{ position:absolute; inset:0; background:rgba(59,53,44,.42); z-index:25; }
.sheet{ position:absolute; left:0; right:0; bottom:0; max-height:82%; z-index:26;
  background:var(--paper); border-radius:20px 20px 0 0; box-shadow:0 -10px 30px rgba(59,53,44,.22);
  display:flex; flex-direction:column; animation:up .22s ease; }

function parteDe(c){
  const e=pro(c.profesionalId); if(!e) return 0;
  const base=c.servicios.reduce((a,id)=>a+(svc(id)?svc(id).precio:0),0);
  if(!base) return c.precioCobrado*(e.comision||0);
  return c.servicios.reduce((a,id)=>{

    return a + (c.precioCobrado*(s.precio/base)) * comisionCat(e, s.cat);
  },0);
}

/* Historial del cliente: servicios frecuentes y profesional preferida */
function historialCliente(ced){
  const done=store.citas.filter(c=>c.clienteCedula===ced && c.estado==='completada');
  const svcCount={}, proCount={};
  done.forEach(c=>{
    c.servicios.forEach(id=>{ svcCount[id]=(svcCount[id]||0)+1; });
    proCount[c.profesionalId]=(proCount[c.profesionalId]||0)+1;
  });
  const topSvc=Object.keys(svcCount).map(id=>({id:id,n:svcCount[id]})).sort((a,b)=>b.n-a.n);
  const topPro=Object.keys(proCount).map(id=>({id:id,n:proCount[id]})).sort((a,b)=>b.n-a.n);
  return { total:done.length, servicios:topSvc, profesionales:topPro,
           proPreferida: topPro[0]? topPro[0].id : null };

function diaSemana(iso){ const p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).getDay(); }

function bloqueosDe(pid, fecha){
  const dow=diaSemana(fecha);
  return store.bloqueos.filter(function(b){
    if(b.pid!==pid) return false;
    if(b.tipo==='permanente') return b.dias.indexOf(dow)>=0 && fecha>=(b.desdeFecha||todayISO);
    return b.fecha===fecha;
  });
}
function chocaBloqueo(pid, fecha, ini, fin){
  return bloqueosDe(pid,fecha).some(b => ini < b.hasta && b.desde < fin);
}
function bloqueoEn(pid, fecha, min){
  return bloqueosDe(pid,fecha).filter(b => min>=b.desde && min<b.hasta)[0] || null;
}

function libre(pid, fecha, ids, min, ignorarId){
  const ini=min, fin=min+bloque(ids);
  if(chocaBloqueo(pid,fecha,ini,fin)) return false;
  return !store.citas.some(c => c.profesionalId===pid && c.fecha===fecha && c.estado!=='cancelada' &&
    c.id!==ignorarId && (ini < finProg(c)) && (c.horaInicio < fin));
}
function horasDe(pid, fecha, ids, ignorarId){
  const out=[], b=bloque(ids);
  for(let m=store.salon.apertura; m+b<=store.salon.cierre; m+=30){
    if(Math.floor(m/60)===12) continue;
    const blk=bloqueoEn(pid,fecha,m);
    out.push({ m:m, ok:libre(pid,fecha,ids,m,ignorarId), blk:!!blk, motivo:blk?blk.motivo:'' });
  }
  return out;
}

function fechaHoraDe(c){
  const p=c.fecha.split('-').map(Number);
  return new Date(p[0],p[1]-1,p[2],Math.floor(c.horaInicio/60),c.horaInicio%60);
}
function horasFaltantes(c){ return (fechaHoraDe(c)-new Date())/3600000; }
function puedeCancelar(c){ return c.estado==='agendada' && horasFaltantes(c) >= HORAS_CANCELA; }

/* Recordatorio: citas dentro de la ventana de 3 horas */
function recordatorios(ced){
  return store.citas.filter(c=>c.clienteCedula===ced && c.estado==='agendada' &&
    horasFaltantes(c)>0 && horasFaltantes(c)<=HORAS_RECUERDA)
    .sort((a,b)=>horasFaltantes(a)-horasFaltantes(b));
}
function cuentaRegresiva(c){
  let ms = fechaHoraDe(c) - new Date();
  if(ms<0) ms=0;
  const t=Math.floor(ms/1000);
  return { d:Math.floor(t/86400), h:Math.floor(t%86400/3600),
           m:Math.floor(t%3600/60), s:t%60, total:t };
}
function textoCuenta(c){
  const r=cuentaRegresiva(c);
  if(r.total<=0) return '¡Es ahora!';
  if(r.d>0) return r.d+'d '+r.h+'h '+r.m+'m';
  return String(r.h).padStart(2,'0')+':'+String(r.m).padStart(2,'0')+':'+String(r.s).padStart(2,'0');
}

/* Balance: lo facturado se cuenta solo sobre trabajos COMPLETADOS */
function descuentoDe(c){
  const lista = c.precioLista!=null ? c.precioLista : precioTotal(c.servicios);
  return Math.max(0, lista - c.precioCobrado);
}
function balance(pid, r){
  const cs=store.citas.filter(c=>c.profesionalId===pid && c.estado!=='cancelada' && enRango(c.fecha,r));
  const hechas=cs.filter(c=>c.estado==='completada');
  const pend=cs.filter(c=>c.estado!=='completada');
  const bruto=hechas.reduce((a,c)=>a+c.precioCobrado,0);
  const parte=hechas.reduce((a,c)=>a+parteDe(c),0);
  const desc=hechas.reduce((a,c)=>a+descuentoDe(c),0);
  return { cs:cs, hechas:hechas, pend:pend, n:cs.length, nHechas:hechas.length,
           bruto:bruto, parte:parte, salon:bruto-parte, descuentos:desc,
           pct: bruto? parte/bruto : 0,
           porVenir:pend.reduce((a,c)=>a+c.precioCobrado,0) };
}
/* Una promo está "vigente" si está activa y el momento actual cae dentro de su ventana.
   desde/hasta son opcionales (formato "YYYY-MM-DDTHH:MM"). Sin ventana = siempre vigente. */
function promoVigente(p){
  if(!p.activa) return false;
  const ahora=new Date();
  if(p.desde && new Date(p.desde) > ahora) return false;   /* programada a futuro */
  if(p.hasta && new Date(p.hasta) < ahora) return false;   /* ya venció */
  return true;
}
function promoProgramada(p){
  return p.activa && p.desde && new Date(p.desde) > new Date();
}
/* Promos que ve un cliente: todas las vigentes (las promos son del negocio) */
function promosActivas(){ return store.promos.filter(promoVigente); }
/* Promos que ve una profesional: las vigentes que apliquen a ella o a "todos" */
function promosDePro(pid){
  return store.promos.filter(p=>promoVigente(p) &&
    (p.pros==='todos' || (Array.isArray(p.pros) && p.pros.indexOf(pid)>=0)));
}

/* ============================================================
   MOTOR DE DESCUENTO POR PROMOCIÓN
   Regla del negocio: el descuento se aplica solo si el servicio está
   dentro de una promo VIGENTE de tipo 'descuento'. La comisión se calcula
   luego sobre lo cobrado (con el descuento ya aplicado).
   ============================================================ */

/* ¿Esta promo de descuento cubre este servicio? */
function promoCubreServicio(p, sid){
  if(p.tipoPromo!=='descuento') return false;
  if(p.servicios==='todos') return true;
  return Array.isArray(p.servicios) && p.servicios.indexOf(sid)>=0;
}

/* Devuelve el descuento en pesos para UN servicio, según las promos vigentes.
   Si varias promos aplican, se toma la de mayor descuento (la más conveniente
   para la paciente). fecha = ISO del día de la cita (para respetar programación). */
function descuentoServicio(sid, fecha){
  const s=svc(sid); if(!s) return { promo:null, monto:0 };
  const ref = fecha? new Date(fecha+'T12:00') : new Date();
  let mejor={ promo:null, monto:0 };
  store.promos.forEach(p=>{
    if(p.tipoPromo!=='descuento' || !p.activa) return;
    if(p.desde && new Date(p.desde) > ref) return;
    if(p.hasta && new Date(p.hasta) < ref) return;
    if(!promoCubreServicio(p, sid)) return;
    let monto = p.descTipo==='pct'
      ? Math.round(s.precio * (p.descValor/100))
      : Math.min(p.descValor, s.precio);          /* fijo nunca mayor al precio */
    monto = Math.max(0, Math.min(monto, s.precio));
    if(monto > mejor.monto) mejor={ promo:p, monto:monto };
  });
  return mejor;
}

/* Descuento total de una cita (suma de sus servicios) para una fecha dada */
function descuentoCita(ids, fecha){
  return ids.reduce((a,id)=>a + descuentoServicio(id, fecha).monto, 0);
}

/* Precio final de una cita con descuentos aplicados */
function precioConDescuento(ids, fecha){
  return Math.max(0, precioTotal(ids) - descuentoCita(ids, fecha));
}

/* Detalle por servicio para mostrar en el balance: lista, descuento y neto */
function desglosePromo(ids, fecha){
  return ids.map(id=>{
    const s=svc(id), d=descuentoServicio(id, fecha);
    return { sid:id, nombre:svcFull(id), lista:s?s.precio:0,
             descuento:d.monto, promo:d.promo, neto:(s?s.precio:0)-d.monto };
  });
}

/* ¿Esta cita llevó descuento por promoción? (compara lista vs cobrado) */
function citaTuvoDescuento(c){
  const lista = c.precioLista!=null ? c.precioLista : precioTotal(c.servicios);
  return lista > c.precioCobrado;
}
/* Etiqueta compacta del descuento de una cita, o '' si no tuvo */
function etiquetaDescuento(c){
  if(!citaTuvoDescuento(c)) return '';
  const lista = c.precioLista!=null ? c.precioLista : precioTotal(c.servicios);
  const desc = lista - c.precioCobrado;
  return '<span class="descpill" title="Descuento por promoción">-'+money(desc)+' promo</span>';
}
/* Bloque de desglose lista -> descuento -> cobrado para el detalle */
function desgloseCitaHTML(c){
  const lista = c.precioLista!=null ? c.precioLista : precioTotal(c.servicios);
  if(lista <= c.precioCobrado) return '';   /* sin descuento: no se muestra nada extra */
  const desc = lista - c.precioCobrado;
  return '<div class="desglose">'+
    '<div class="dl"><span>Precio lista</span><b>'+money(lista)+'</b></div>'+
    '<div class="dl warn"><span>Descuento promo</span><b>-'+money(desc)+'</b></div>'+
    '<div class="dl tot"><span>Cobrado</span><b>'+money(c.precioCobrado)+'</b></div>'+
    '</div>';
}

function otrosDe(r){ return store.otros.filter(o=>enRango(o.fecha,r)); }
function totalOtros(r){ return otrosDe(r).reduce((a,o)=>a+o.valor,0); }

function balanceSalon(r){
  const t={ bruto:0, parte:0, salon:0, nHechas:0, porVenir:0, descuentos:0, filas:[] };
  store.profesionales.forEach(e=>{
    const b=balance(e.id,r);
    if(b.n===0) return;
    t.filas.push({ e:e, b:b });
    t.bruto+=b.bruto; t.parte+=b.parte; t.salon+=b.salon;
    t.nHechas+=b.nHechas; t.porVenir+=b.porVenir; t.descuentos+=b.descuentos;
  });
  return t;
}

function detalleFacturacion(e, r){
  const b=balance(e.id,r);
  if(!b.hechas.length) return '<div class="empty" style="padding:14px">'+sinFacturado(r)+'</div>';
  /* Resumen por tipo de trabajo */
  const porSvc={};
  b.hechas.forEach(c=>{
    const base=c.servicios.reduce((a,id)=>a+(svc(id)?svc(id).precio:0),0)||1;
    c.servicios.forEach(id=>{
      const sv=svc(id); if(!sv) return;
      const parte=c.precioCobrado*(sv.precio/base);
      const x=porSvc[id]||(porSvc[id]={s:sv,n:0,val:0});
      x.n++; x.val+=parte;
    });
  });
  const tipos=Object.keys(porSvc).map(k=>porSvc[k]).sort((a,b2)=>b2.val-a.val);

  return '<div class="detbox">'+
    '<div class="accsec"><div class="t">Qué trabajos realizó</div>'+
      tipos.map(x=>'<div class="detrow"><span>'+x.s.nombre+' <span class="pill">'+x.n+'</span></span>'+
        '<b>'+money(x.val)+'</b></div>').join('')+
    '</div>'+
    '<div class="accsec"><div class="t">Detalle de cada trabajo facturado</div>'+
      b.hechas.slice().sort((a,b2)=>b2.fecha.localeCompare(a.fecha)||b2.horaInicio-a.horaInicio).map(c=>{
        const cl=cli(c.clienteCedula);
        return '<div class="miniappt" style="padding:11px 13px">'+
          '<span class="h">'+fechaCorta(c.fecha)+'<br>'+minToHHMM(c.horaInicio)+'</span>'+
          '<div class="g"><div class="w">'+(cl?cl.nombre+' '+cl.apellido:'Cliente')+'</div>'+
          '<div class="p">'+nombresSvc(c.servicios)+' '+etiquetaDescuento(c)+'</div></div>'+
          '<div style="text-align:right">'+
          (citaTuvoDescuento(c)? '<div style="font-size:10px;color:var(--ink-soft);text-decoration:line-through">'+
            money(c.precioLista!=null?c.precioLista:precioTotal(c.servicios))+'</div>' : '')+
          '<div style="font-weight:600">'+money(c.precioCobrado)+'</div>'+
          (modoComision()? '<div style="font-size:10.5px;color:var(--sage-deep);font-weight:600">'+
            money(parteDe(c))+' para ella</div>' : '')+'</div>'+
        '</div>';
      }).join('')+
    '</div></div>';
}

/* Carga de archivo -> dataURL (queda embebido en el HTML/estado, sin backend) */
function cargarMediaPromo(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const esVideo=f.type.indexOf('video')===0;
  /* Límite prudente para no inflar la página: 8 MB */
  if(f.size > 8*1024*1024){ alert('El archivo supera 8 MB. Usa uno más liviano.'); input.value=''; return; }
  const rd=new FileReader();
  rd.onload=function(){ admin.promoForm.media={ tipo:esVideo?'video':'imagen', datos:rd.result }; renderAdmPromos(); };
  rd.readAsDataURL(f);
}

function guardarPromo(){
  const err=document.getElementById('pmErr');
  const pf=admin.promoForm;
  const tit=(document.getElementById('pmTit').value||'').trim();
  const desc=(document.getElementById('pmDesc').value||'').trim();
  const fallo=m=>{ err.textContent=m; err.classList.add('show'); };
  if(tit.length<2) return fallo('Escribe un título.');
  if(desc.length<2) return fallo('Escribe la descripción.');
  if(!pf.prosTodos && !pf.pros.length) return fallo('Elige al menos un profesional o marca "todos".');
  const desde = pf.programar? ((document.getElementById('pmDesde')||{}).value||'') : '';
  const hasta = (document.getElementById('pmHasta')||{}).value||'';
  if(pf.programar && !desde) return fallo('Indica la fecha y hora de inicio.');
  if(desde && hasta && new Date(hasta) <= new Date(desde)) return fallo('El fin debe ser posterior al inicio.');

  /* Campos de descuento (solo si es tipo 'descuento') */
  let descTipo=pf.descTipo||'pct', descValor=0, servicios='todos';
  if(pf.tipoPromo==='descuento'){
    const dv=(document.getElementById('pmDescVal')||{}).value||'';
    descValor = descTipo==='fijo'? soloDigitos(dv) : (parseInt(dv)||0);
    if(descValor<=0) return fallo('Indica el valor del descuento.');
    if(descTipo==='pct' && descValor>100) return fallo('El porcentaje no puede pasar de 100.');
    if(!pf.svcTodos && !pf.svc.length) return fallo('Elige a qué servicios aplica el descuento, o marca "todos".');
    servicios = pf.svcTodos? 'todos' : pf.svc.slice();
  }

  if(pf.editId){
    /* Modificar la promo existente, conservando su id y estado activo/inactivo */
    const p=store.promos.find(x=>x.id===pf.editId);
    if(p){
      p.titulo=tit; p.descripcion=desc; p.media=pf.media||null;
      p.pros=pf.prosTodos? 'todos' : pf.pros.slice();
      p.desde=desde; p.hasta=hasta;
      p.tipoPromo=pf.tipoPromo; p.descTipo=descTipo; p.descValor=descValor; p.servicios=servicios;
    }
  } else {
    store.promos.push({ id:uid(), titulo:tit, descripcion:desc,
      media: pf.media||null,
      pros: pf.prosTodos? 'todos' : pf.pros.slice(),
      desde:desde, hasta:hasta, activa:true,
      tipoPromo:pf.tipoPromo, descTipo:descTipo, descValor:descValor, servicios:servicios });
  }
  admin.nuevaPromo=false;
  admin.promoForm={ editId:null, media:null, prosTodos:true, pros:[], programar:false, tipoPromo:'info', descTipo:'pct', descValor:0, svcTodos:true, svc:[] };
  renderAdmPromos();
}

  const p=store.promos.find(x=>x.id===id); if(p) p.activa=!p.activa;
  renderAdmPromos();

function guardarNuevoPro(){
  const g=id=>(document.getElementById(id).value||'').trim();
  const err=document.getElementById('npErr');
  const nom=g('npNom'), ape=g('npApe'), ced=g('npCed').replace(/\D/g,''),
        cel=g('npCel').replace(/\D/g,''), cod=g('npCod').replace(/\D/g,'');
  if(nom.length<2||ape.length<2||ced.length<6||cel.length<7||cod.length<3){
    err.textContent='Completa nombre, apellido, cédula, celular y un código de al menos 3 dígitos.';
    err.classList.add('show'); return;

  if(!admin.espNuevo.length){
    err.textContent='Marca al menos una especialidad.'; err.classList.add('show'); return; }
  if(store.profesionales.some(p=>p.codigo===cod)){
    err.textContent='Ese código ya lo usa otra profesional. Elige uno distinto.'; err.classList.add('show'); return;
  }
  const com=Math.min(100,Math.max(0,parseInt(g('npCom'))||50))/100;
  const comisiones={}; admin.espNuevo.forEach(id=>comisiones[id]=com);
  store.profesionales.push({ id:'p'+uid(), nombre:nom, apellido:ape, cedula:ced, celular:cel,

    activa:true, disponible:false, comision:com, codigo:cod });

}

function deshabilitarPro(pid){
  const e=pro(pid); e.activa=false; e.disponible=false;
  admin.vista='main'; renderAdmin();

function eliminarPro(pid){
  /* Confirmación en pantalla, en dos toques. Sin confirm() del navegador,
     que en algunos móviles queda bloqueado y parecía que el botón no servía. */
  if(admin.confirmarBorrado!==pid){ admin.confirmarBorrado=pid; renderAdmin(); return; }
  const e=pro(pid); if(!e){ admin.vista='main'; renderAdmin(); return; }
  /* 1. sus citas se eliminan para no dejar registros sin dueño */
  for(let i=store.citas.length-1;i>=0;i--) if(store.citas[i].profesionalId===pid) store.citas.splice(i,1);
  /* 2. otros valores asociados pasan a ser generales del consultorio */
  store.otros.forEach(o=>{ if(o.pid===pid) o.pid=''; });
  /* 3. se retiran sus skills */
  store.servicios.forEach(s=>{ const k=s.pros.indexOf(pid); if(k>=0) s.pros.splice(k,1); });
  /* 4. si tenía sesión abierta, se cierra */
  if(sesion===pid) sesion=null;
  store.profesionales.splice(store.profesionales.indexOf(e),1);
  admin.confirmarBorrado=null; admin.detPid=null;
  admin.vista='main'; admin.pid=null; renderAdmin();
}

function mensajeAviso(c){
  const cl=cli(c.clienteCedula), e=pro(c.profesionalId);
  const cuando = fechaLarga(c.fecha)+' a las '+minToHHMM(c.horaInicio);
  const servs = nombresSvc(c.servicios);
  const nom = cl? cl.nombre : '';
  const saludoTxt = 'Hola'+(nom? ' '+nom : '')+', te saluda '+store.salon.nombre+'.';
  if(admin.avisarTipo==='recordatorio'){
    return saludoTxt+' Te recordamos tu cita de '+servs+' con '+nomComp(e)+' el '+cuando+
      '. Si necesitas cambiarla, escríbenos con al menos '+HORAS_CANCELA+' horas de anticipación. ¡Te esperamos!';
  }
  if(admin.avisarTipo==='cambio'){
    return saludoTxt+' Confirmamos el cambio que solicitaste: tu cita de '+servs+' con '+nomComp(e)+
      ' quedó para el '+cuando+'. Si algo no coincide, respóndenos por aquí. ¡Gracias!';
  }
  /* confirmacion (por defecto) */
  return saludoTxt+' Queremos confirmar tu cita de '+servs+' con '+nomComp(e)+' el '+cuando+
    '. ¿Nos confirmas que asistirás? Si necesitas moverla, escríbenos. ¡Gracias!';
}

function marcarAvisado(id){
  const c=store.citas.filter(x=>x.id===id)[0];
  if(c){ const d=new Date(); c.avisado=d.getDate()+'/'+(d.getMonth()+1)+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
}

/* ---------- Asignar / modificar trabajo ---------- */
function admAsignar(pid){
  admin.vista='asignar';
  admin.asig={ pid: pid || store.profesionales.filter(e=>e.activa)[0].id,
               ced:'', ids:[], fecha:todayISO, hora:null, valor:null,
               completado:false, fijo:!!pid, editId:null };
  renderAdmin();
}
function admModificar(id){
  const c=store.citas.filter(x=>x.id===id)[0];
  admin.vista='asignar';
  admin.asig={ pid:c.profesionalId, ced:c.clienteCedula, ids:c.servicios.slice(),
               fecha:c.fecha, hora:c.horaInicio, valor:c.precioCobrado,
               completado:c.estado==='completada', fijo:true, editId:c.id };
  renderAdmin();
}
function asigPro(pid){ admin.asig.pid=pid; admin.asig.ids=[]; admin.asig.hora=null; admin.asig.valor=null; renderAdmin(); }
function asigTog(id){
  const a=admin.asig.ids, k=a.indexOf(id);
  if(k>=0) a.splice(k,1); else a.push(id);
  admin.asig.hora=null; admin.asig.valor=null; renderAdmin();
}
function asigFecha(v){ admin.asig.fecha=v; admin.asig.hora=null; renderAdmin(); }
function asigHora(m){ admin.asig.hora=m; renderAdmin(); }
function asigValor(v){ admin.asig.valor=Math.max(0,soloDigitos(v)); renderAdmin(); }
function asigCompletado(){ admin.asig.completado=!admin.asig.completado; renderAdmin(); }

function admCancelarCita(id){
  const c=store.citas.filter(x=>x.id===id)[0];
  if(admin.confirmarCita!==id){ admin.confirmarCita=id; renderAdmin(); return; }
  admin.confirmarCita=null;
  c.estado='cancelada';
  admin.vista='perfil'; admin.pid=c.profesionalId; renderAdmin();
}

function pintarClienteAsig(){
  const box=document.getElementById('aDatos'); if(!box) return;
  const c=cli(admin.asig.ced);
  box.innerHTML = c
    ? '<div class="opt" style="cursor:default"><div><b>'+c.nombre+' '+c.apellido+'</b>'+

      '<div class="field"><label>Celular</label><input id="aCel" inputmode="numeric" placeholder="300 000 0000"></div>';
}

function guardarAsignacion(){
  const a=admin.asig, err=document.getElementById('aErr');
  const ced=a.editId? a.ced : (document.getElementById('aCed').value||'').replace(/\D/g,'');
  if(ced.length<6){ err.textContent='Ingresa una cédula válida (mínimo 6 dígitos).'; err.classList.add('show'); return; }
  let c=cli(ced);
  if(!c){
    const g=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
    const nom=g('aNom'), ape=g('aApe'), cel=g('aCel').replace(/\D/g,'');
    if(nom.length<2||ape.length<2||cel.length<7){
      err.textContent='Completa nombre, apellido y celular del paciente nuevo.'; err.classList.add('show'); return; }
    c={ cedula:ced, nombre:nom, apellido:ape, celular:cel }; store.clientes.push(c);
  }
  if(!a.ids.length){ err.textContent='Selecciona al menos un trabajo.'; err.classList.add('show'); return; }
  if(a.hora===null || !libre(a.pid, a.fecha, a.ids, a.hora, a.editId)){
    err.textContent='Esa hora ya no está libre. Elige otra.'; err.classList.add('show'); return; }
  const val=soloDigitos((document.getElementById('aVal')||{}).value)||precioTotal(a.ids);

  if(a.editId){
    const cita=store.citas.filter(x=>x.id===a.editId)[0];
    cita.servicios=a.ids.slice(); cita.fecha=a.fecha; cita.horaInicio=a.hora;
    cita.precioCobrado=Math.max(0,val);
    cita.estado=a.completado?'completada':'agendada';
    if(a.completado){ cita.inicioReal=a.hora; cita.finReal=a.hora+durTotal(a.ids); }
    else { cita.inicioReal=null; cita.finReal=null; }
  } else {
    const cita={ id:uid(), clienteCedula:ced, servicios:a.ids.slice(), profesionalId:a.pid,
      fecha:a.fecha, horaInicio:a.hora, estado:a.completado?'completada':'agendada',
      inicioReal:null, finReal:null, precioLista:precioTotal(a.ids), precioCobrado:Math.max(0,val), origen:'admin' };
    if(a.completado){ cita.inicioReal=a.hora; cita.finReal=a.hora+durTotal(a.ids); }
    store.citas.push(cita);
  }
  admin.vista='perfil'; admin.pid=a.pid; admin.rangoPerfil='mes';
  renderAdmin();
}

function editPro(pid,k,val){ const e=pro(pid); e[k]=(val||'').trim()||e[k]; renderAdmin(); }
function editCodigo(pid,val){
  const e=pro(pid);
  const nuevo=String(val||'').replace(/[^0-9]/g,'');
  if(nuevo.length<3){ alert('El código debe tener al menos 3 dígitos.'); renderAdmin(); return; }
  if(store.profesionales.some(p=>p.id!==pid && p.codigo===nuevo)){
    alert('Ese código ya lo usa otra profesional.'); renderAdmin(); return; }
  e.codigo=nuevo;
  if(sesion===pid) sesion=null;
  renderAdmin();
}
function editComision(pid,val){ pro(pid).comision=Math.min(100,Math.max(0,parseInt(val)||0))/100; renderAdmin(); }
function toggleEsp(pid,catId){
  const e=pro(pid); e.esp=e.esp||[]; e.comisiones=e.comisiones||{};
  const k=e.esp.indexOf(catId);
  if(k>=0){
    e.esp.splice(k,1); delete e.comisiones[catId];
    /* al quitar la especialidad se retiran sus skills, para no dejar inconsistencias */
    store.servicios.filter(s=>s.cat===catId).forEach(s=>{
      const j=s.pros.indexOf(pid); if(j>=0) s.pros.splice(j,1); });
  } else {
    e.esp.push(catId);
    if(e.comisiones[catId]==null) e.comisiones[catId]=e.comision||0.5;
  }
  renderAdmin();
}
function editComEsp(pid,catId,val){
  const e=pro(pid); e.comisiones=e.comisiones||{};
  e.comisiones[catId]=Math.min(100,Math.max(0,parseInt(val)||0))/100;
  renderAdmin();
}
function togglePro(pid){ const e=pro(pid); e.activa=!e.activa; if(!e.activa) e.disponible=false; renderAdmin(); }
function toggleSkillPro(sid,pid){
  const p=svc(sid).pros, k=p.indexOf(pid);
  if(k>=0) p.splice(k,1); else p.push(pid);
  renderAdmin();
}

function borrarSvc(sid){

/* ============================================================
   TARJETA DE CITA
   ============================================================ */
function apptHTML(c, acciones, conFecha, editVal, modificar, contacto){
  const cl=cli(c.clienteCedula);
  const est=durTotal(c.servicios);
  let action='';
  if(acciones && c.estado==='agendada') action='<button class="btn btn-sage" onclick="iniciar(\''+c.id+'\')">Iniciar</button>';
  if(acciones && c.estado==='en_curso') action='<button class="btn btn-ink" onclick="finalizar(\''+c.id+'\')">Finalizar</button>';
  if(c.estado==='completada'){
    const dur=c.finReal-c.inicioReal, d=dur-est;
    action='<div style="text-align:right; font-size:11.5px; color:var(--ink-soft);">'+dur+' min real<br>'+
      '<span style="color:'+(d>0?'var(--warn)':'var(--sage-deep)')+'">'+(d>0?'+':'')+d+' vs est.</span></div>';
  }
  const valor = c.estado==='completada'
    ? (editVal
        ? '<div class="valbox"><label>Facturado</label>'+
          '<span class="pesos">$</span><input type="text" inputmode="numeric" value="'+miles(c.precioCobrado)+
          '" onchange="editValor(\''+c.id+'\',this.value)"></div>'
        : '<span class="valtag done">'+money(c.precioCobrado)+' facturado</span>')
    : '<span class="valtag">'+money(c.precioCobrado)+' estimado</span>';
  const mod = modificar
    ? ' <button class="btn btn-out" style="padding:5px 11px; font-size:11.5px; margin-left:6px"'+
      ' onclick="admModificar(\''+c.id+'\')">Modificar</button>'+
      (c.estado==='agendada'
        ? ' <button class="btn btn-sage" style="padding:5px 11px; font-size:11.5px; margin-left:6px"'+
          ' onclick="admAvisar(\''+c.id+'\')">Avisar al cliente</button>' : '')
    : '';

  return '<div class="appt '+(c.estado==='completada'?'done':c.estado==='en_curso'?'live':'')+'">'+
    '<div class="time">'+minToHHMM(c.horaInicio)+
      (conFecha?'<div style="font-size:9.5px;color:var(--ink-soft);font-weight:400;">'+fechaCorta(c.fecha)+'</div>':'')+'</div>'+
    '<div class="info"><b>'+(cl?cl.nombre+' '+cl.apellido:'Cliente')+'</b>'+
      '<div class="c"><span class="sv">'+nombresSvc(c.servicios)+'</span>'+
        (c.servicios.length>1?' <span class="pill">'+c.servicios.length+' servicios</span>':'')+
        '<br>'+(contacto&&cl? 'Cel. '+cl.celular+' · CC '+cl.cedula+' · ' : '')+'est. '+est+' min'+
        (c.origen==='manual'?' · agendada en consultorio':'')+
        (c.origen==='admin'?' · asignada por el admin':'')+'</div>'+
      '<div style="margin-top:7px">'+valor+mod+'</div></div>'+
    '<div class="state '+c.estado+'">'+c.estado.replace('_',' ')+'</div>'+action+'</div>';
}
function editValor(id,val){
  const c=store.citas.filter(x=>x.id===id)[0];
  c.precioCobrado=Math.max(0,soloDigitos(val));
  if(role==='admin') renderAdmin(); else renderPro();
}

const MESCORTO=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function diasEnMes(ym){ const p=ym.split('-').map(Number); return new Date(p[0],p[1],0).getDate(); }
function mesMas(ym,n){
  const p=ym.split('-').map(Number); const d=new Date(p[0],p[1]-1+n,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function blkMes(n){
  const nuevo=mesMas(blkForm.mes,n);
  if(nuevo < todayISO.slice(0,7)) return;      /* no se navega al pasado */
  blkForm.mes=nuevo; repintarBloqueos();
}
/* Franjas múltiples para el horario fijo */
function blkAddRango(){
  const d=blkForm.pDesde, h=blkForm.pHasta;
  if(h<=d){ blkForm.errRango='La hora final debe ser mayor que la inicial.'; repintarBloqueos(); return; }
  if(blkForm.rangos.some(r=>d<r.hasta && r.desde<h)){
    blkForm.errRango='Esa franja se cruza con otra que ya agregaste.'; repintarBloqueos(); return; }
  blkForm.rangos.push({desde:d, hasta:h});
  blkForm.rangos.sort((a,b)=>a.desde-b.desde);
  blkForm.errRango=''; repintarBloqueos();
}
function blkDelRango(i){ blkForm.rangos.splice(i,1); repintarBloqueos(); }

const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

function blkModo(m){ blkForm.modo=m; blkForm.desde=null; blkForm.hasta=null; repintarBloqueos(); }
function blkFecha(f){ blkForm.fecha=f; blkForm.desde=null; blkForm.hasta=null; repintarBloqueos(); }
function blkDia(d){
  const k=blkForm.dias.indexOf(d);
  if(k>=0) blkForm.dias.splice(k,1); else blkForm.dias.push(d);
  repintarBloqueos();
}
/* Selección de rango: primer toque marca el inicio, el segundo el final */
function blkHora(m){
  if(blkForm.desde===null || blkForm.hasta!==null){ blkForm.desde=m; blkForm.hasta=null; }
  else if(m<=blkForm.desde){ blkForm.desde=m; }
  else { blkForm.hasta=m; }
  repintarBloqueos();
}
function blkRangoP(k,v){ blkForm[k]=parseInt(v)||0; repintarBloqueos(); }
function blkLimpiar(){ blkForm.desde=null; blkForm.hasta=null; repintarBloqueos(); }

function horasSelect(id, val, fn){
  let o='';
  for(let m=store.salon.apertura; m<=store.salon.cierre; m+=30)
    o+='<option value="'+m+'"'+(m===val?' selected':'')+'>'+minToHHMM(m)+'</option>';
  return '<select id="'+id+'" onchange="'+fn+'">'+o+'</select>';
}

function panelBloqueos(pid){
  const e=pro(pid);
  const f=blkForm.fecha;

  /* --- Agenda del día elegido: citas + bloqueos --- */
  const citasDia=store.citas.filter(c=>c.profesionalId===pid && c.fecha===f && c.estado!=='cancelada')
                            .sort((a,b)=>a.horaInicio-b.horaInicio);
  let franjas='';
  for(let m=store.salon.apertura; m<store.salon.cierre; m+=30){
    const ocupada=citasDia.filter(c=>m>=c.horaInicio && m<finProg(c))[0];
    const yaBlk=bloqueoEn(pid,f,m);
    const enRangoSel = blkForm.desde!==null &&
      (blkForm.hasta!==null ? (m>=blkForm.desde && m<blkForm.hasta) : m===blkForm.desde);
    const cls = ocupada? 'ocu' : yaBlk? 'blk' : enRangoSel? 'sel' : '';
    franjas+='<button class="slot '+cls+'"'+(ocupada?' disabled title="Cita agendada"':'')+
      (yaBlk?' disabled title="Ya bloqueado"':'')+
      ' onclick="blkHora('+m+')">'+minToHHMM(m)+'</button>';
  }

  /* --- Calendario del mes --- */
  const ym=blkForm.mes, pm=ym.split('-').map(Number);
  const nDias=diasEnMes(ym);
  const primerDow=(new Date(pm[0],pm[1]-1,1).getDay()+6)%7;   /* 0 = lunes */
  let celdas='';
  for(let i=0;i<primerDow;i++) celdas+='<div class="cd vacio"></div>';
  for(let d=1; d<=nDias; d++){
    const iso=ym+'-'+String(d).padStart(2,'0');
    const pasado = iso < todayISO;
    const nCitas=store.citas.filter(c=>c.profesionalId===pid && c.fecha===iso && c.estado!=='cancelada').length;
    const nBlk=bloqueosDe(pid,iso).length;
    const cls=[ 'cd' ];
    if(pasado) cls.push('pasado');
    if(iso===todayISO) cls.push('hoy');
    if(blkForm.fecha===iso) cls.push('sel');
    if(nBlk) cls.push('conblk');
    celdas+='<div class="'+cls.join(' ')+'"'+(pasado?'':' onclick="blkFecha(\''+iso+'\')"')+'>'+
      '<span class="n">'+d+'</span>'+
      (nBlk? '<span class="mk blk"></span>' : nCitas? '<span class="mk cit">'+nCitas+'</span>' : '')+
      '</div>';
  }
  const puedeAtras = mesMas(ym,-1) >= todayISO.slice(0,7);
  const calendario =
    '<div class="calnav">'+
      '<button class="calbtn"'+(puedeAtras?'':' disabled')+' onclick="blkMes(-1)">&#8249;</button>'+
      '<b>'+MESES[pm[1]-1].charAt(0).toUpperCase()+MESES[pm[1]-1].slice(1)+' '+pm[0]+'</b>'+
      '<button class="calbtn" onclick="blkMes(1)">&#8250;</button></div>'+
    '<div class="calgrid">'+
      ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>'<div class="cdh">'+d+'</div>').join('')+
      celdas+'</div>'+
    '<div class="leyenda" style="margin-top:8px">'+
      '<span><i class="sw"></i>Disponible</span>'+
      '<span><i class="sw cit"></i>Con citas</span>'+
      '<span><i class="sw blk"></i>Con bloqueo</span></div>';

  const futuros=store.bloqueos.filter(b=>b.pid===pid && (b.tipo==='permanente' || b.fecha>=todayISO))
    .sort((a,b)=>(a.tipo==='permanente'?1:0)-(b.tipo==='permanente'?1:0));

  return ''+
    '<div class="catlabel">Bloquear fechas y horas</div>'+
    '<div class="ph-note" style="margin:0 0 12px; font-size:12.5px">'+
      'Para horarios en los que no atiendes. Puede ser algo puntual de un día, '+
      'o un horario fijo que se repite todas las semanas.</div>'+

    '<div class="tabs">'+
      '<button class="'+(blkForm.modo==='puntual'?'on':'')+'" onclick="blkModo(\'puntual\')">Un día puntual</button>'+
      '<button class="'+(blkForm.modo==='permanente'?'on':'')+'" onclick="blkModo(\'permanente\')">Horario fijo</button>'+
    '</div>'+

    (blkForm.modo==='puntual'
      ? '<div class="field"><label>Elige el día</label>'+calendario+'</div>'+
        '<div class="field"><label>Toca la hora de inicio y luego la de fin · '+fechaLarga(f)+'</label>'+
          '<div class="slotgrid">'+franjas+'</div>'+
          '<div class="leyenda">'+
            '<span><i class="sw"></i>Libre</span>'+
            '<span><i class="sw ocup"></i>Con cita</span>'+
            '<span><i class="sw blk"></i>Ya bloqueado</span>'+
            '<span><i class="sw sel"></i>Seleccionado</span></div>'+
          (blkForm.desde!==null
            ? '<div class="rangosel">Bloquearás de <b>'+minToHHMM(blkForm.desde)+'</b> a <b>'+
              minToHHMM(blkForm.hasta!==null?blkForm.hasta:blkForm.desde+30)+'</b>'+
              (blkForm.hasta===null? ' <span class="mini-nota">— toca otra hora para extender el rango</span>':'')+
              ' <button class="btn btn-out" style="padding:4px 10px;font-size:11.5px" onclick="blkLimpiar()">Limpiar</button></div>'
            : '<div class="hint">Aún no has elegido el rango.</div>')+
        '</div>'
      : '<div class="field"><label>¿Qué días se repite?</label><div class="skills">'+
          [1,2,3,4,5,6,0].map(d=>'<button class="skill '+(blkForm.dias.indexOf(d)>=0?'on':'')+
            '" onclick="blkDia('+d+')">'+DOW[d]+'</button>').join('')+'</div></div>'+

        '<div class="field"><label>Franjas que quieres bloquear</label>'+
          '<div class="row2" style="align-items:flex-end">'+
            '<div class="field" style="margin-bottom:0"><label>Desde</label>'+
              horasSelect('blkPD',blkForm.pDesde,"blkRangoP('pDesde',this.value)")+'</div>'+
            '<div class="field" style="margin-bottom:0"><label>Hasta</label>'+
              horasSelect('blkPH',blkForm.pHasta,"blkRangoP('pHasta',this.value)")+'</div>'+
          '</div>'+
          '<button class="btn btn-out btn-block" style="margin-top:10px" onclick="blkAddRango()">'+
            '+ Agregar esta franja</button>'+
          (blkForm.errRango? '<div class="err show">'+blkForm.errRango+'</div>':'')+
        '</div>'+

        (blkForm.rangos.length
          ? '<div class="franjas">'+blkForm.rangos.map(function(r,i){
              return '<div class="franja"><span class="h">'+minToHHMM(r.desde)+' – '+minToHHMM(r.hasta)+'</span>'+
                '<span class="d">'+Math.round((r.hasta-r.desde)/60*10)/10+' h</span>'+
                '<button class="iconbtn" onclick="blkDelRango('+i+')">&times;</button></div>';
            }).join('')+'</div>'
          : '<div class="empty">Aún no has agregado ninguna franja.</div>')+

        '<div class="hint">Puedes agregar varias en el mismo día. Ejemplo: de 12:00 a 13:00 por el almuerzo '+
        'y de 15:00 a 17:00 por otro compromiso. Se repiten todas las semanas hasta que las quites.</div>')+

    '<div class="field" style="margin-top:14px"><label>Motivo (opcional)</label>'+
      '<input id="blkMotivo" placeholder="Ej. Trabajo en la mañana" value="'+blkForm.motivo+'"></div>'+
    '<button class="btn btn-ink btn-block" onclick="guardarBloqueo(\''+pid+'\')">Guardar bloqueo</button>'+
    '<div class="err" id="blkErr"></div>'+

    '<div class="catlabel">Bloqueos activos</div>'+
    (futuros.length
      ? futuros.map(b=>{
          const dia=(b.desde<=store.salon.apertura && b.hasta>=store.salon.cierre);
          const cuando = b.tipo==='permanente'
            ? b.dias.slice().sort().map(d=>DOW[d]).join(', ')+' · cada semana'
            : fechaLarga(b.fecha);
          return '<div class="miniappt" style="padding:11px 13px">'+
            '<span class="h">'+(b.tipo==='permanente'?'FIJO':fechaCorta(b.fecha))+'</span>'+
            '<div class="g"><div class="w">'+(dia?'Todo el día':minToHHMM(b.desde)+' – '+minToHHMM(b.hasta))+'</div>'+
            '<div class="p">'+cuando+(b.motivo?' · '+b.motivo:'')+'</div></div>'+
            '<button class="iconbtn" title="Quitar" onclick="borrarBloqueo(\''+b.id+'\')">&times;</button></div>';
        }).join('')
      : '<div class="empty">Sin bloqueos. Tu agenda está abierta en todo el horario del consultorio.</div>');
}

function repintarBloqueos(){
  const mo=document.getElementById('blkMotivo'); if(mo) blkForm.motivo=mo.value;
  if(role==='pro') renderPro(); else renderAdmin();
}

function guardarBloqueo(pid){
  const err=document.getElementById('blkErr');
  const motivo=((document.getElementById('blkMotivo')||{}).value||'').trim();
  const fallo=m=>{ if(err){ err.textContent=m; err.classList.add('show'); } };

  if(blkForm.modo==='puntual'){
    if(blkForm.desde===null) return fallo('Toca en la agenda la hora en que empieza el bloqueo.');
    const desde=blkForm.desde, hasta=(blkForm.hasta!==null? blkForm.hasta : blkForm.desde+30);
    const choca=store.citas.filter(c=>c.profesionalId===pid && c.fecha===blkForm.fecha &&
      c.estado!=='cancelada' && (c.horaInicio<hasta) && (desde<finProg(c)));
    if(choca.length) return fallo('Hay '+choca.length+' cita(s) en esa franja. Muévelas o cancélalas antes.');
    store.bloqueos.push({ id:uid(), pid:pid, tipo:'puntual', fecha:blkForm.fecha,
      desde:desde, hasta:hasta, motivo:motivo });
    blkForm.desde=null; blkForm.hasta=null;
  } else {
    if(!blkForm.dias.length) return fallo('Marca al menos un día de la semana.');
    if(!blkForm.rangos.length) return fallo('Agrega al menos una franja horaria.');
    /* Revisa choques de todas las franjas en las próximas 8 semanas */
    let choques=0;
    for(let i=0;i<56;i++){
      const d=addDays(todayISO,i);
      if(blkForm.dias.indexOf(diaSemana(d))<0) continue;
      blkForm.rangos.forEach(function(r){
        choques+=store.citas.filter(c=>c.profesionalId===pid && c.fecha===d && c.estado!=='cancelada' &&
          (c.horaInicio<r.hasta) && (r.desde<finProg(c))).length;
      });
    }
    if(choques) return fallo('Ese horario fijo choca con '+choques+' cita(s) ya agendada(s). Resuélvelas primero.');
    blkForm.rangos.forEach(function(r){
      store.bloqueos.push({ id:uid(), pid:pid, tipo:'permanente', dias:blkForm.dias.slice(),
        desde:r.desde, hasta:r.hasta, desdeFecha:todayISO, motivo:motivo });
    });
    blkForm.dias=[]; blkForm.rangos=[];
  }
  blkForm.motivo='';
  repintarBloqueos();
}
function borrarBloqueo(id){
  const i=store.bloqueos.findIndex(b=>b.id===id);
  if(i>=0) store.bloqueos.splice(i,1);
  repintarBloqueos();
}

function guardarManual(){
  const e=pro(sesion), n=pflow.nueva, err=document.getElementById('nErr');
  const ced=(document.getElementById('nCed').value||'').replace(/\D/g,'');
  if(ced.length<6){ err.textContent='Ingresa una cédula válida (mínimo 6 dígitos).'; err.classList.add('show'); return; }
  let c=cli(ced);
  if(!c){
    const g=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
    const nom=g('nNom'), ape=g('nApe'), cel=g('nCel').replace(/\D/g,'');
    if(nom.length<2||ape.length<2||cel.length<7){
      err.textContent='Completa nombre, apellido y celular del paciente nuevo.'; err.classList.add('show'); return; }
    c={ cedula:ced, nombre:nom, apellido:ape, celular:cel }; store.clientes.push(c);
  }
  if(!n.ids.length){ err.textContent='Selecciona al menos un servicio.'; err.classList.add('show'); return; }
  if(n.hora===null || !libre(e.id, n.fecha, n.ids, n.hora)){
    err.textContent='Esa hora ya no está libre. Elige otra.'; err.classList.add('show'); return; }
  store.citas.push({ id:uid(), clienteCedula:ced, servicios:n.ids.slice(), profesionalId:e.id,
    fecha:n.fecha, horaInicio:n.hora, estado:'agendada', inicioReal:null, finReal:null,
    precioLista:precioTotal(n.ids), precioCobrado:precioConDescuento(n.ids, n.fecha), origen:'manual' });
  pflow.msg='Cita guardada: '+c.nombre+' '+c.apellido+' · '+nombresSvc(n.ids)+' · '+fechaLarga(n.fecha)+' '+minToHHMM(n.hora)+'.';
  pflow.nueva={ ced:'', ids:[], fecha:todayISO, hora:null };
  pflow.vista='hoy'; renderPro();
}

function listaServicios(lista){
  /* Los servicios con `grupo` (ej. Epilación) se muestran como una opción
     que se despliega en sus zonas (Cejas, Bozo). */
  const vistos={}, out=[];
  lista.forEach(function(s){
    if(!s.grupo){
      out.push('<div class="opt '+(cflow.ids.indexOf(s.id)>=0?'sel':'')+'" onclick="cTog(\''+s.id+'\')">'+
        '<div><b>'+s.nombre+'</b></div><div class="check">&#10003;</div></div>');
      return;
    }
    if(vistos[s.grupo]) return;
    vistos[s.grupo]=1;
    const hermanos=lista.filter(x=>x.grupo===s.grupo);
    const key='gr_'+s.grupo;
    const marcados=hermanos.filter(x=>cflow.ids.indexOf(x.id)>=0).length;
    const abierto=!!cflow.grupos[key] || marcados>0;
    out.push(
      '<div class="opt grp '+(marcados?'sel':'')+'" onclick="cTogGrupo(\''+key+'\')">'+
        '<div><b>'+s.grupo+'</b><div class="m">Elige la zona'+
        (marcados? ' · '+marcados+' seleccionada'+(marcados>1?'s':'') : '')+'</div></div>'+
        '<span class="arw">'+(abierto?'&#8964;':'&#8250;')+'</span></div>'+
      (abierto? '<div class="zonas">'+hermanos.map(x=>
          '<div class="opt zona '+(cflow.ids.indexOf(x.id)>=0?'sel':'')+'" onclick="cTog(\''+x.id+'\')">'+
          '<div><b>'+(x.zona||x.nombre)+'</b></div><div class="check">&#10003;</div></div>').join('')+
        '</div>' : ''));
  });
  return out.join('');
}
