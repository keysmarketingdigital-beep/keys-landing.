<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEYS Odontología · Panel administrador</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Fraunces:wght@500;600&family=Montserrat:wght@500;600&family=Space+Grotesk:wght@400;500&family=Oswald:wght@500;600&display=swap">
<style>
/* Concepto: marco de plataforma KEYS (azul marino + azul eléctrico del logo) que envuelve la marca de cada negocio, que entra por --t. */
:root{
  --bg:#F3F6FC; --surf:#FFFFFF; --surf2:#E9EFFB; --ink:#0F2A5C; --ink2:#4B5E88; --line:#D8E1F2;
  --blue:#1A6BFF; --btn:#1A6BFF; --ok:#1B7F52; --warn:#A8500B; --bad:#B3261E;
  --t:#9A6B1F; --ll:block; --dd:none;
  --f-display:'Sora','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:0 1px 2px rgba(15,42,92,.06),0 10px 30px rgba(15,42,92,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1020; --surf:#111A33; --surf2:#18234A; --ink:#E7EEFF; --ink2:#9DB0DA; --line:#25325C;
  --blue:#6AA2FF; --ok:#4CC38A; --warn:#F0A261; --bad:#FF8A80; --ll:none; --dd:block; --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1020; --surf:#111A33; --surf2:#18234A; --ink:#E7EEFF; --ink2:#9DB0DA; --line:#25325C;
  --blue:#6AA2FF; --ok:#4CC38A; --warn:#F0A261; --bad:#FF8A80; --ll:none; --dd:block; --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surf)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
.muted{color:var(--ink2)} .note{font-size:12.5px;color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Marco de plataforma */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--surf);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.top>*{min-width:0}
.logo{height:34px;width:auto;max-width:100%}
.logo-l{display:var(--ll)} .logo-d{display:var(--dd)}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
.tab:hover{background:var(--surf2)} .tab.on{background:var(--ink);color:var(--bg)}
.tenantbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.tenantbar .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--surf2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline}
main{padding-top:14px}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);display:flex;gap:6px 18px;flex-wrap:wrap}

/* Botones y controles */
.btn{border:0;background:var(--btn);color:#fff;font-weight:600;padding:11px 18px;border-radius:12px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.lg{padding:14px 26px;font-size:16px} .btn.block{width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink2)}
.btn.warn{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.lnk{border:0;background:none;color:var(--ink2);text-decoration:underline;padding:6px 0;font-size:13px}
.inp,select.inp{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--surf);color:var(--ink);font:inherit;font-size:15px}
.fl{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.err{margin-top:10px;font-size:13px;color:var(--bad)}
.tview{--btn:var(--t)}
.mono-badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;color:#fff;
  background:linear-gradient(135deg,var(--t),#0F2A5C);box-shadow:0 8px 24px color-mix(in srgb,var(--t) 35%,transparent)}
.mono-badge.sm{width:52px;height:52px;font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--surf2);color:var(--ink2)}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surf));color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,var(--surf));color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surf));color:var(--bad)}
.chip.t{background:color-mix(in srgb,var(--t) 16%,var(--surf));color:var(--t)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t)}


.ph2{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.ph2>div{min-width:0}
.erow{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.erow:hover{background:color-mix(in srgb,var(--surf2) 50%,transparent)}
.erow .g{flex:1;min-width:0}.erow .g b{display:block}.erow .g span{font-size:13px;color:var(--ink2)}
.box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg);margin:8px 0 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
.fgrid>div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1.5px solid var(--line);background:var(--surf);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none}
.checkrow{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);cursor:pointer}
.checkrow input{width:18px;height:18px;accent-color:var(--blue)}
.acts2{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.tblw{overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--surf2)}
.tbl td.det{background:var(--bg);font-size:13px;color:var(--ink2)}.tbl td.det div{padding:3px 0}
.prow .g span{display:block}
.panel .acc{margin-top:8px}
/* Landing */
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:var(--surf);border-radius:12px;padding:11px 14px;margin:10px 0 8px;font-weight:600;font-size:14px;color:var(--ink)}
.acc[aria-expanded=true]{border-color:var(--t)}
.ph-body .hero-car{aspect-ratio:16/10;border-radius:16px;margin-bottom:12px;box-shadow:none}
.ph-body .hs .cap{left:14px;right:14px;bottom:26px}.ph-body .hs .cap b{font-size:18px}.ph-body .hs .cap p{font-size:12.5px}
.hero-car{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:var(--surf2);box-shadow:var(--sh);width:100%}
.hs{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none}
.hs.on{opacity:1;pointer-events:auto}
.hs img{width:100%;height:100%;object-fit:cover;display:block}
.hs .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,32,.88),rgba(10,16,32,.15) 65%)}
.hs .cap{position:absolute;left:18px;right:18px;bottom:30px;color:#fff}
.hs .cap .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hs .cap b{display:block;font-family:var(--f-display);font-size:22px;margin-top:4px;line-height:1.2}
.hs .cap p{font-size:13.5px;opacity:.9;margin-top:3px;max-width:44ch}
.dots{position:absolute;right:14px;bottom:12px;display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45)}
.dots button.on{background:#fff;width:22px;border-radius:6px}

.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding:28px 0 36px}
.hero h1{font-size:clamp(32px,6vw,54px);margin:10px 0 14px}
.lead{font-size:17px;color:var(--ink2);max-width:52ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.facts{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:22px;font-size:13.5px;color:var(--ink2)}
.facts b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.collage img{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block}
.collage .a{grid-row:span 2;aspect-ratio:3/4} .collage .b,.collage .c{aspect-ratio:16/11}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec>h2{font-size:26px;margin-bottom:6px} .sec>.sub{color:var(--ink2);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.card img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block}
.card .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.card .cb p{font-size:13px;color:var(--ink2);min-height:0}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2)}
.meta .pr{font-family:var(--f-display);font-weight:600;color:var(--ink);font-size:16px}
.cat{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:18px 0 10px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pro{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display);background:linear-gradient(135deg,var(--t),#0F2A5C)}
.pro b{display:block;font-size:14.5px} .pro span{font-size:12.5px;color:var(--ink2)}
.rev{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.stars{color:var(--t);letter-spacing:2px;font-size:14px}
.rev p{font-size:14.5px} .rev small{color:var(--ink2)}
.locgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:center}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surf2);aspect-ratio:4/3;width:100%;max-width:100%}
.map svg{display:block;width:100%;height:100%}
.info{display:flex;flex-direction:column;gap:14px;justify-content:center}
.info dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.info dd{margin:2px 0 0;font-size:15px}
.cta-band{margin-top:10px;border-radius:20px;padding:30px;background:linear-gradient(120deg,var(--t),#0F2A5C);color:#fff;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{font-size:24px;color:#fff} .cta-band .btn{background:#fff;color:#0F2A5C}
.powered{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:12.5px;color:var(--ink2)}
.powered .logo{height:22px}

/* Vista cliente */
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:34px;align-items:start}
.hints{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.hints h3{font-size:20px} .hints ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink2);font-size:14px}
.hints code{font-family:var(--f-mono);background:var(--surf2);padding:1px 6px;border-radius:6px;color:var(--ink);font-size:13px}
.phone{background:var(--surf);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);overflow:hidden;width:100%;max-width:440px;margin-inline:auto}
.ph-head{display:flex;gap:12px;align-items:center;padding:16px 18px;background:linear-gradient(120deg,#0F2A5C,color-mix(in srgb,var(--t) 70%,#0F2A5C));color:#fff}
.ph-head .mono-badge{width:40px;height:40px;font-size:14px;box-shadow:none;background:rgba(255,255,255,.16)}
.ph-head b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.2} .ph-head span{font-size:12px;opacity:.8}
.ph-body{padding:16px 18px 20px;min-height:460px}
.ph-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2);text-align:center}
.ph-body h3{font-size:19px;margin:4px 0 4px}
.back{border:0;background:none;color:var(--ink2);font-weight:600;font-size:14px;padding:10px 14px 10px 0;margin-bottom:2px;min-height:44px;display:inline-flex;align-items:center;gap:6px;position:relative;z-index:1;touch-action:manipulation}
.phone{scroll-margin-top:84px}
.steps{display:flex;gap:5px;margin:2px 0 12px} .steps i{height:4px;flex:1;border-radius:4px;background:var(--line)} .steps i.on{background:var(--t)}
.login{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding-top:4px}
.login h3{margin-top:12px}
.hello{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hello small{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)} .hello h3{font-size:22px;margin:0}
.cdcard{border-radius:16px;padding:16px;background:color-mix(in srgb,var(--t) 10%,var(--surf));border:1.5px solid color-mix(in srgb,var(--t) 45%,var(--line));text-align:center;margin-bottom:12px}
.cdcard small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t)}
.cd{display:flex;justify-content:center;gap:16px;margin:10px 0 8px}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:48px}
.cd b{font-family:var(--f-display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.cd i{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:5px}
.cdcard p{font-size:13px}
.remind{border:1.5px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surf));border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.remind b{color:var(--warn)}
.promo{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.promo .pbody{padding:14px 16px;background:var(--surf2)}
.promo .pbody+.pbody{border-top:1px dashed var(--line)}
.promo .lab{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t)}
.promo b{display:block;margin-top:3px} .promo p{font-size:13px;color:var(--ink2);margin-top:2px}
.promo-fb{height:130px;position:relative;margin-bottom:12px;border-radius:16px;overflow:hidden}
.promo-fb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo-fb span{position:absolute;left:14px;bottom:12px;color:#fff;font-family:var(--f-display);font-weight:600;font-size:18px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.svc{display:flex;gap:12px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;background:var(--surf)}
.svc.sel{border-color:var(--t);background:color-mix(in srgb,var(--t) 8%,var(--surf))}
.svc img{width:72px;height:72px;border-radius:11px;object-fit:cover;flex:none}
.svc .sb{min-width:0;flex:1} .svc .sb b{font-size:14.5px;display:block} .svc .sb p{font-size:12.5px;color:var(--ink2);line-height:1.35;margin:2px 0 4px}
.svc .sb .m{font-size:12.5px;color:var(--ink2);display:flex;gap:12px} .svc .sb .m b{display:inline;font-family:var(--f-mono);color:var(--ink)}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent;flex:none;font-style:normal}
.svc.sel .chk{background:var(--t);border-color:var(--t);color:#fff}
.basket{position:sticky;bottom:0;background:var(--surf);border-top:1px solid var(--line);margin:10px -18px -20px;padding:12px 18px 16px}
.basket .bt{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)} .basket .bt b{color:var(--ink);font-family:var(--f-mono)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:9px;cursor:pointer;background:var(--surf)}
.opt.sel{border-color:var(--t);background:color-mix(in srgb,var(--t) 8%,var(--surf))}
.opt b{display:block;font-size:14.5px} .opt span.s{font-size:12.5px;color:var(--ink2)}
.opt .grow{flex:1;min-width:0}
.quick{border:1.5px dashed var(--t);color:var(--t);background:transparent;width:100%;padding:12px;border-radius:14px;font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center;margin:4px 0 4px}
.quick:disabled{opacity:.45;cursor:not-allowed}
.fmcal{max-width:380px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px} .cal-nav b{font-family:var(--f-display);font-size:15px;text-transform:capitalize}
.cal-nav button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf)} .cal-nav button:disabled{opacity:.3;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--ink2);padding-bottom:3px}

function obstaculos(pid,f,ign){
  const T=S();
  return T.appts.filter(a=>a.pid===pid&&a.fecha===f&&a.estado!=='cancelada'&&a.id!==ign).map(a=>[a.start,endOf(a)])
   .concat(T.blocks.filter(b=>b.pid===pid&&b.fecha===f).map(b=>[b.desde,b.hasta])).concat([T.lunch]);
}
function libre(pid,f,ids,m,ign){
  if(!diaAbierto(f)||m<S().open||m+block(ids)>S().close) return false;
  const fin=m+block(ids);
  return !obstaculos(pid,f,ign).some(o=>m<o[1]&&o[0]<fin);
}
function huecoLibre(pid,f,m,ign){
  if(m>=S().close) return 0;
  let fin=S().close;
  for(const o of obstaculos(pid,f,ign)){ if(o[0]<=m&&m<o[1]) return 0; if(o[0]>m) fin=Math.min(fin,o[0]); }
  return fin-m;
}
function mejorAjuste(ids,hueco){
  let best=[];
  for(let mask=1;mask<(1<<ids.length);mask++){
    const sub=ids.filter((_,i)=>mask&(1<<i));
    if(block(sub)>hueco) continue;
    if(sub.length>best.length||(sub.length===best.length&&price(sub)>price(best))) best=sub;
  }
  return best;
}
const BUF=10;
const paso=()=>(svcsOn().length?Math.min.apply(null,svcsOn().map(x=>x.dur)):30)+BUF;

function prefPro(ced){
  const c={}; S().appts.filter(a=>a.ced===ced&&a.estado==='completada').forEach(a=>{c[a.pid]=(c[a.pid]||0)+1;});
  const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k||null;
}
function slotsDia(f){
  const ids=cf.ids, b=block(ids), T=S();
  const list=((cf.pid&&cf.pid!=='any')?[cf.pid]:prosPara(ids).map(p=>p.id)).filter(pid=>!(f===TODAY&&pro(pid).disponible===false));
  const pref=cf.user?prefPro(cf.user.ced):null;
  if(pref&&list.indexOf(pref)>0){list.splice(list.indexOf(pref),1);list.unshift(pref);}
  const out=[], st=paso(), starts=[];
  if(!diaAbierto(f)) return out;
  segs(T).forEach(sg=>{for(let m=sg[0];m<sg[1];m+=st)starts.push(m);});
  for(const m of starts){
    if(enPasado(f,m)) continue;
    const s={m:m,ok:false,pid:null,corto:false,hueco:0};
    list.forEach(pid=>{
      if(libre(pid,f,ids,m,cf.modId)){ if(!s.ok){s.ok=true;s.pid=pid;} }
      else{ const h=huecoLibre(pid,f,m,cf.modId); if(h>0&&h<b&&h>s.hueco){s.hueco=h;s.cpid=pid;} }
    });
    if(!s.ok&&s.hueco>0) s.corto=true;
    out.push(s);
  }
  return out;
}
function proximo(ids,pidFijo,ign){

  cf.ids=saveIds;cf.pid=savePid;cf.modId=saveMod;
  return res;
}

/* Precios y promociones: el mejor descuento vigente por servicio */
function descSvc(sid,f,T){
  T=T||S(); const s=svc(sid,T); let best=0;
  if(!s) return 0;
  T.promos.forEach(p=>{
    if(!p.on||!p.tipo||p.tipo==='info') return;
    if(p.desde&&f<p.desde) return; if(p.hasta&&f>p.hasta) return;
    if(p.svcs&&p.svcs.indexOf(sid)<0) return;
    const m=p.tipo==='pct'?s.precio*p.valor/100:Math.min(s.precio,p.valor);
    if(m>best) best=m;
  });
  return Math.round(best);
}
function descCita(ids,f,T){return ids.reduce((a,i)=>a+descSvc(i,f,T),0);}
function cobro(ids,f,T){return price(ids,T)-descCita(ids,f,T);}

const listaA=a=>a.lista!=null?a.lista:price(a.ids);
const vigente=p=>p.on&&(!p.desde||TODAY>=p.desde)&&(!p.hasta||TODAY<=p.hasta);
const estadoPromo=p=>!p.on?['pausada','']:(p.hasta&&TODAY>p.hasta)?['vencida','bad']:(p.desde&&TODAY<p.desde)?['programada','warn']:['activa','ok'];

function loadImg(input,cb){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,640/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.82)); render();
  };im.src=r.result;};
  r.readAsDataURL(f);
}

function motivoSlot(pid,f,ids,m,ign){
  const T=S(), fin=m+block(ids), r=[];
  if(!diaAbierto(f)) return 'El negocio no atiende ese día de la semana (Marca → Horario de atención).';
  if(m<T.open||fin>T.close) return 'El bloque de '+block(ids)+' min termina después del cierre ('+hhmm(T.close)+').';
  T.appts.filter(a=>a.pid===pid&&a.fecha===f&&a.estado!=='cancelada'&&a.id!==ign&&m<endOf(a)&&a.start<fin).forEach(a=>{const c=cliente(a.ced);r.push('Cita de '+(c?c.nombre+' '+c.apellido:'un cliente')+' · '+nombres(a.ids)+' · '+hhmm(a.start)+' a '+hhmm(endOf(a)));});
  T.blocks.filter(b=>b.pid===pid&&b.fecha===f&&m<b.hasta&&b.desde<fin).forEach(b=>r.push('Bloqueo '+(b.desde<=T.open&&b.hasta>=T.close?'de todo el día':hhmm(b.desde)+' a '+hhmm(b.hasta))+' · motivo: '+(b.motivo||'sin motivo')));
  if(T.lunch&&T.lunch[1]>T.lunch[0]&&m<T.lunch[1]&&T.lunch[0]<fin) r.push('Pausa de almuerzo · '+hhmm(T.lunch[0])+' a '+hhmm(T.lunch[1]));
  return r.length?r.join('\n'):'No hay un hueco suficiente para el bloque completo.';
}
function slotsFor(ids,pid,f,ign,allowPast){
  const T=S(), st=paso(), out=[];
  if(!ids.length||!pid||!diaAbierto(f)) return out;
  segs(T).forEach(sg=>{for(let m=sg[0];m<sg[1];m+=st){
    if(!allowPast&&enPasado(f,m)) continue;
    out.push({m:m,ok:libre(pid,f,ids,m,ign)});
  }});
  return out;
}
function fmDiaOk(f){
  if(!diaAbierto(f)) return 0;

  let cells='';for(let i=0;i<lead;i++)cells+='<div class="d e"></div>';

function guardarCita(){

}

/* ---- Balance ---- */
function rango(r){
  if(r==='dia') return [TODAY,TODAY];
  if(r==='semana'){const k=(parse(TODAY).getDay()+6)%7, a=addDays(TODAY,-k);return [a,addDays(a,6)];}
  const y=+TODAY.slice(0,4), m=+TODAY.slice(5,7);
  return [TODAY.slice(0,8)+'01',TODAY.slice(0,8)+pad(new Date(y,m,0).getDate())];
}
function balance(pid,r){
  const [a,b]=rango(r), l=S().appts.filter(x=>(!pid||x.pid===pid)&&x.fecha>=a&&x.fecha<=b);
  const done=l.filter(x=>x.estado==='completada'), ven=l.filter(x=>x.estado==='agendada'||x.estado==='en_curso');
  const bruto=done.reduce((s,x)=>s+valorA(x),0), lista=done.reduce((s,x)=>s+listaA(x),0), parte=Math.round(done.reduce((s,x)=>s+valorA(x)*com(x.pid),0));
  return {n:done.length,bruto:bruto,desc:Math.max(0,lista-bruto),parte:parte,neg:bruto-parte,porVenir:ven.reduce((s,x)=>s+valorA(x),0),nVen:ven.length,done:done};
}
function admBalance(){
  const T=S(), r=adm.bal, [a,b]=rango(r), tot=balance(null,r);
  const ot=T.otros.filter(o=>o.fecha>=a&&o.fecha<=b), ing=ot.filter(o=>o.tipo==='ingreso').reduce((s,o)=>s+o.valor,0), gas=ot.filter(o=>o.tipo==='gasto').reduce((s,o)=>s+o.valor,0);
  const lbl={dia:'hoy',semana:'esta semana',mes:'este mes'}[r];
  const filas=prosAll().concat(T.pros.filter(p=>p.borrado)).map(p=>{const x=balance(p.id,r);if(!x.n&&p.borrado)return '';
    return `<tr class="clk" onclick="adm.balPid=adm.balPid==='${p.id}'?null:'${p.id}';render()"><td>${esc(p.nombre)}</td><td>${x.n}</td><td>${money(x.bruto)}</td><td>${Math.round(com(p.id)*100)} %</td><td>${money(x.parte)}</td><td>${money(x.neg)}</td></tr>`+

function horaSel(val,key){const T=S();let o='';for(let m=T.open;m<=T.close;m+=15)o+=`<option value="${m}"${m===val?' selected':''}>${hhmm(m)}</option>`;return `<select class="inp" onchange="bk.${key}=+this.value">${o}</select>`;}

function bkModo(m){bk.modo=m;bk.err='';bk.msg='';render();}
function bkFecha(v){bk.fecha=v||TODAY;bk.horas=[];bk.err='';bk.msg='';render();}
function bkHora(m){const k=bk.horas.indexOf(m);if(k>=0)bk.horas.splice(k,1);else bk.horas.push(m);bk.horas.sort((a,b)=>a-b);bk.msg='';bk.err='';render();}
function bkRangos(){const o=[];bk.horas.forEach(m=>{const u=o[o.length-1];if(u&&u.hasta===m)u.hasta=m+30;else o.push({desde:m,hasta:m+30});});return o;}
function bkSlotInfo(pid,f,m){
  const T=S();
  if(!diaAbierto(f)) return 'El negocio no atiende ese día';
  if(f===TODAY&&m<=nowMin()) return 'Hora que ya pasó';
  if(T.lunch&&T.lunch[1]>T.lunch[0]&&m<T.lunch[1]&&T.lunch[0]<m+30) return 'Pausa de almuerzo';
  const a=T.appts.find(x=>x.pid===pid&&x.fecha===f&&x.estado!=='cancelada'&&x.start<m+30&&endOf(x)>m);
  if(a){const c=cliente(a.ced);return 'Cita de '+(c?c.nombre:'un cliente')+' · '+nombres(a.ids);}
  const b=T.blocks.find(x=>x.pid===pid&&x.fecha===f&&x.desde<m+30&&x.hasta>m);
  if(b) return 'Ya bloqueado'+(b.motivo?': '+b.motivo:'');

}
function blkForm(ctx){

     ${pid?`<div class="slots">${grid||'<p class="note">Sin horario ese día.</p>'}</div><p class="note" style="margin-top:8px">Las horas tachadas ya tienen cita, almuerzo o un bloqueo; pasa el cursor para ver cuál. Puedes marcar horas juntas o separadas.</p>`:'<p class="note">Elige primero el profesional.</p>'}

  <div class="row" style="margin-top:12px"><button class="btn sm" onclick="guardarBloqueo('${ctx}')">Bloquear</button></div></div>`;
}
function guardarHoras(ctx){
  const T=S(), pid=bkPid(ctx); bk.err='';bk.msg='';
  if(!pid){bk.err='Elige el profesional.';return render();}
  if(!bk.horas.length){bk.err='Toca en la lista las horas que quieres bloquear.';return render();}
  const rs=bkRangos();
  rs.forEach(r=>T.blocks.push({id:uid(),pid:pid,fecha:bk.fecha,desde:r.desde,hasta:r.hasta,motivo:bk.motivo.trim()}));
  bk.msg='Listo: '+rs.length+' franja'+(rs.length===1?'':'s')+' bloqueada'+(rs.length===1?'':'s')+' ('+rs.map(r=>hhmm(r.desde)+'–'+hhmm(r.hasta)).join(', ')+').';
  bk.horas=[];bk.motivo='';render();
}
function guardarBloqueo(ctx){
  if(bk.modo==='horas') return guardarHoras(ctx);
  const T=S(); bk.err=''; bk.msg='';
  const pids=ctx==='pro'?[pv.pid]:(bk.pid?[bk.pid]:prosAll().map(p=>p.id));
  const d1=bk.desde||TODAY, d2=bk.hasta||d1;
  if(d1<TODAY){bk.err='No puedes bloquear días que ya pasaron.';return render();}
  if(d2<d1){bk.err='La fecha final no puede ser anterior a la inicial.';return render();}
  const ini=bk.todo?T.open:bk.ini, fin=bk.todo?T.close:bk.fin;
  if(fin<=ini){bk.err='La hora final debe ser posterior a la inicial.';return render();}
  let n=0, afect=0;
  for(let f=d1;f<=d2&&n<62;f=addDays(f,1)){n++;pids.forEach(pid=>{
    T.blocks.push({id:uid(),pid:pid,fecha:f,desde:ini,hasta:fin,motivo:bk.motivo.trim()});
    afect+=T.appts.filter(a=>a.pid===pid&&a.fecha===f&&a.estado==='agendada'&&a.start<fin&&endOf(a)>ini).length;
  });}
  bk.msg='Horario bloqueado.'+(afect?' Ojo: '+afect+' cita'+(afect===1?' ya agendada queda':'s ya agendadas quedan')+' dentro del bloqueo. Revísalas en la agenda.':'');
  bk.motivo=''; render();
}
function blkList(pid){

}

const h12=m=>{const h=Math.floor(m/60),mm=m%60;return ((h%12)||12)+':'+pad(mm)+(h<12?' a. m.':' p. m.');};
const DSEM=[['1','Lun'],['2','Mar'],['3','Mié'],['4','Jue'],['5','Vie'],['6','Sáb'],['0','Dom']];
const DNOM={1:'lunes',2:'martes',3:'miércoles',4:'jueves',5:'viernes',6:'sábado',0:'domingo'};
function horarioTxt(T){
  const ord=[1,2,3,4,5,6,0].filter(d=>T.dias.indexOf(d)>=0), runs=[];
  ord.forEach(d=>{const u=runs[runs.length-1];const i=[1,2,3,4,5,6,0].indexOf(d);if(u&&u.i===i-1){u.b=d;u.i=i;}else runs.push({a:d,b:d,i:i});});
  const dias=runs.map(r=>r.a===r.b?DNOM[r.a]:DNOM[r.a]+' a '+DNOM[r.b]).join(', ');
  const s=dias?dias.charAt(0).toUpperCase()+dias.slice(1):'Cerrado';
  return s+' · '+h12(T.open)+' a '+h12(T.close);
}
function optH(from,to,val){let o='';for(let m=from;m<=to;m+=30)o+=`<option value="${m}"${m===val?' selected':''}>${h12(m)}</option>`;return o;}
function fueraHorario(){const T=S();return T.appts.filter(a=>a.estado==='agendada'&&a.fecha>=TODAY&&(!diaAbierto(a.fecha)||a.start<T.open||endOf(a)>T.close)).length;}
function setHor(k,v){
  const T=S(); adm.horErr=''; v=+v;
  const sin=!(T.lunch&&T.lunch[1]>T.lunch[0]);
  if(k==='open'){if(v>=T.close-60){adm.horErr='La apertura debe ser al menos una hora antes del cierre.';return render();}T.open=v;}
  else if(k==='close'){if(v<=T.open+60){adm.horErr='El cierre debe ser al menos una hora después de la apertura.';return render();}T.close=v;}
  else if(k==='l0'){if(v>=T.lunch[1]){adm.horErr='El almuerzo debe empezar antes de terminar.';return render();}T.lunch=[v,T.lunch[1]];}
  else if(k==='l1'){if(v<=T.lunch[0]){adm.horErr='El almuerzo debe terminar después de empezar.';return render();}T.lunch=[T.lunch[0],v];}
  else if(k==='sin'){T.lunch=sin?[Math.max(T.open+60,720),Math.max(T.open+120,780)]:[0,0];}
  if(T.lunch[1]>T.lunch[0]&&(T.lunch[0]<T.open||T.lunch[1]>T.close)){T.lunch=[0,0];adm.horErr='El almuerzo quedó fuera del horario y se quitó. Vuelve a definirlo si lo necesitas.';}
  T.horario=horarioTxt(T); render();
}
function togDiaAten(d){
  const T=S(), k=T.dias.indexOf(d);adm.horErr='';
  if(k>=0){if(T.dias.length===1){adm.horErr='Debe haber al menos un día de atención.';return render();}T.dias.splice(k,1);}else T.dias.push(d);
  T.horario=horarioTxt(T); render();
}

  <div class="fgrid" style="margin-top:10px"><div><label class="fl">Apertura</label><select class="inp" onchange="setHor('open',this.value)">${optH(240,Math.min(T.close-60,720),T.open)}</select></div>
  <div><label class="fl">Cierre</label><select class="inp" onchange="setHor('close',this.value)">${optH(Math.max(T.open+60,720),1380,T.close)}</select></div></div>
  <label class="checkrow" style="margin:12px 0 6px"><input type="checkbox" ${sin?'':'checked'} onchange="setHor('sin')"> Pausa de almuerzo (nadie agenda en ese rango)</label>
  ${sin?'':`<div class="fgrid"><div><label class="fl">Almuerzo desde</label><select class="inp" onchange="setHor('l0',this.value)">${optH(T.open,T.close-30,T.lunch[0])}</select></div><div><label class="fl">Hasta</label><select class="inp" onchange="setHor('l1',this.value)">${optH(T.open+30,T.close,T.lunch[1])}</select></div></div>`}
  <label class="fl">Días de atención</label><div class="chips">${DSEM.map(d=>`<button class="chipbtn${T.dias.indexOf(+d[0])>=0?' on':''}" onclick="togDiaAten(${d[0]})">${d[1]}</button>`).join('')}</div>
  ${adm.horErr?`<div class="err" style="margin-top:10px">${esc(adm.horErr)}</div>`:''}

}

<script>
/* ===== Sincroniza las citas reservadas en la agenda (localStorage ko-demo-v1) con este panel ===== */
(function(){
  var KEY='ko-demo-v1', PM={p1:'o1',p2:'o2'}, first=true, base=document.title, pend=0;
  function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
  function sync(){
    var db=read(); if(!db||!db.citas||typeof TEN==='undefined')return;
    var T=TEN.od, nuevas=[], cambio=false;
    db.citas.forEach(function(c){
      var cli=(db.clientes||[]).filter(function(x){return x.id===c.cliente})[0]||{};
      if(cli.apellido==='Ejemplo')return; /* citas de ejemplo de la agenda: el panel ya trae las suyas */
      var id='ag-'+c.id, ced=cli.cedula||('ag-'+cli.id), a=T.appts.filter(function(x){return x.id===id})[0];
      if(!T.clients.some(function(x){return x.ced===ced}))T.clients.push({ced:ced,nombre:cli.nombre||'Cliente',apellido:cli.apellido||'',tel:cli.telefono||'',invitado:!cli.cedula});
      if(!a){
        a={id:id,ced:ced,ids:(c.ids||[]).slice(),pid:PM[c.pid]||c.pid,fecha:c.fecha,start:c.ini,estado:c.estado||'agendada',recordado:false,origen:'agenda'};
        T.appts.push(a); cambio=true; if(c.estado==='agendada')nuevas.push(a);
      }else if(a.estado!==c.estado&&(c.estado==='cancelada'||a.estado==='agendada')){a.estado=c.estado;cambio=true;}
    });
    if(!cambio)return;
    if(!first&&nuevas.length){
      nuevas.forEach(function(a){if(typeof notificar==='function')notificar(T,'confirmacion',a,true)});
      pend+=nuevas.length; document.title='('+pend+') Cita nueva · '+base;
      if(typeof toast==='function')toast(nuevas.length===1?'Cita nueva desde la agenda':nuevas.length+' citas nuevas desde la agenda','Ya aparece en la pestaña Agenda y en Mensajes.');
    }
    if(typeof fm!=='undefined'&&fm)return; /* no interrumpir un formulario abierto */
    if(typeof render==='function')render();
  }
  function limpiar(){pend=0;document.title=base;}
  document.addEventListener('visibilitychange',function(){if(!document.hidden){sync();limpiar();}});
  window.addEventListener('focus',function(){sync();limpiar();});
  window.addEventListener('storage',function(e){if(e.key===KEY)sync();});
  setInterval(function(){if(!document.hidden)sync();},30000);
  sync(); first=false;
})();
</script>
